<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kick Challenge">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Kick Challenge</title>
<style>
:root{
  --bg:#eef3ee; --card:#ffffff; --ink:#15261b; --muted:#5d6e62; --line:#d3ddd5;
  --verde:#1f5f3a; --verde2:#2c7a4b; --ok:#16833a; --ok-bg:#e2f3e6;
  --err:#bf3326; --err-bg:#fbe8e5; --resaltador:#c9f26b; --aviso:#fff5d6;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom,0px)}
:focus-visible{outline:3px solid #2b6fd6;outline-offset:2px}
a{color:var(--verde)}
h2{font-size:24px;margin:0;line-height:1.2}
h3{font-size:18px;margin:0 0 12px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.ayuda{font-size:14px;margin:4px 0 12px}

/* Encabezado */
.top{background:var(--verde);color:#fff;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));position:sticky;top:0;z-index:5}
.top .comp{background:none;border:0;color:#fff;font-size:19px;font-weight:800;padding:8px 6px;cursor:pointer;text-align:left}
.top nav{display:flex;gap:2px}
.top nav a{color:#d6eadc;text-decoration:none;padding:10px 12px;border-radius:8px;font-weight:600;font-size:15px}
.top nav a.on{background:rgba(255,255,255,.18);color:#fff}
.sync{margin-left:auto;font-size:13px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.12)}
.sync.pend{background:#f0c24b;color:#3a2a00}
.sync.off{background:#e57c6f;color:#fff}
.top .salir{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}

main{padding:16px;max-width:1240px;margin:0 auto}
.barra-tit{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.acc{display:flex;gap:8px;flex-wrap:wrap}
.volver{display:inline-block;margin-bottom:10px;text-decoration:none;font-weight:600;padding:6px 0}

/* Controles */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;font-family:inherit}
.btn.pri{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.peligro{color:var(--err);border-color:#e6b3ac}
.btn.chico{min-height:40px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
input,select{min-height:48px;font-size:16px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-family:inherit;width:100%}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.form-col{display:flex;flex-direction:column;gap:12px}
.fila-form{display:flex;gap:10px}
.fila-form input{flex:1}
.fila-sec{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.acciones{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.aviso{background:var(--aviso);border:1px solid #ecd98f;padding:10px 12px;border-radius:10px;font-size:14px}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px}
.chip.curso{background:#fdf0c8;color:#6b5000}
.chip.fin{background:#dfeee3;color:var(--verde)}

/* Tablas */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%}
.t th,.t td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.t th{font-size:13px;color:var(--muted);font-weight:600}
.t td.acc{justify-content:flex-end}
.num,.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.c,.t th.c{text-align:center}
.barra{display:inline-block;width:70px;height:8px;background:#e3e9e4;border-radius:4px;margin-left:8px;vertical-align:middle;overflow:hidden}
.barra i{display:block;height:100%;background:var(--verde2)}
tr.gana td{background:#f3fae6}
.tag{font-size:12px;font-weight:700;background:var(--err-bg);color:var(--err);padding:2px 7px;border-radius:12px;margin-left:6px}

/* Lista de ediciones */
.lista-ed{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ed-card{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;color:var(--ink)}
.ed-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:18px;margin-bottom:2px}
.ed-gan{margin-top:8px;font-size:15px}
.ed-gan span{color:var(--muted);display:inline-block;min-width:82px}

/* Ganadores de la edición */
.ganadores{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.ganadores>div{background:#fff;border:1px solid var(--line);border-left:5px solid var(--verde);border-radius:10px;padding:10px 14px}
.ganadores span{display:block;font-size:13px;color:var(--muted)}
.ganadores strong{font-size:17px}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px}
.tabs a{padding:12px 18px;text-decoration:none;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs a.on{color:var(--verde);border-color:var(--verde)}
.punto{display:inline-block;background:var(--err);color:#fff;border-radius:10px;font-size:12px;padding:0 6px;margin-left:4px}

/* Planilla de carga */
.planilla{border-collapse:separate;border-spacing:0;width:100%;min-width:920px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.planilla th{background:var(--verde);color:#fff;font-size:13px;padding:8px 4px;text-align:center;font-weight:700;line-height:1.15}
.planilla th span{display:block;font-weight:400;font-size:11px;opacity:.85;margin-top:2px}
.planilla th.th-nom{text-align:left;padding-left:10px}
.planilla td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;height:58px;padding:0}
.planilla td:last-child{border-right:0}
.planilla .nro{font-weight:800;font-size:18px;color:var(--muted);width:40px}
.planilla .nom{text-align:left;padding:0 10px;font-weight:600;white-space:nowrap}
.planilla .celda{cursor:pointer;font-size:28px;font-weight:800;min-width:66px;user-select:none}
.planilla .celda:not(.ro):active{background:#dfe9e1}
.planilla .celda.vacia:not(.ro)::after{content:"+";color:#c5d0c8;font-size:22px;font-weight:400}
.celda.ok{color:var(--ok)}
.celda.mal{color:var(--err)}
.planilla .tot{font-weight:800;font-size:20px;width:56px}
.planilla .toteq{font-weight:900;font-size:30px;width:84px;background:#f6faf6;border-bottom:3px solid var(--verde)}
.planilla .toteq small{display:block;font-size:11px;font-weight:700;color:var(--verde2)}
.planilla tr.pts td{height:30px;font-size:13px;color:var(--muted);background:#fafcfa;border-bottom:3px solid var(--verde)}
.planilla tr.pts td.max{color:var(--ink);font-weight:800}
.planilla tr.pts td.sub{font-weight:500;font-size:12px}
.planilla td.racha{background:var(--resaltador)!important}
.leyenda{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:10px}
.leyenda b{font-size:18px}
.leyenda .ok{color:var(--ok)} .leyenda .mal{color:var(--err)}
.leyenda i{display:inline-block;width:16px;height:12px;background:var(--resaltador);vertical-align:middle;margin-right:4px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(12,30,18,.55);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal{background:#fff;border-radius:16px;padding:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.modal h3{font-size:22px;margin-bottom:2px}
.op{min-height:88px;font-size:21px;font-weight:800;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;font-family:inherit;width:100%}
.op.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg);margin-top:12px}
.op.mal{color:var(--err)}
.op.sel{outline:4px solid var(--ink);outline-offset:1px}
.op-fila{display:grid;gap:10px;margin-top:10px}
.nuevo-j{display:flex;gap:8px}
.nuevo-j input{flex:1}

/* Desempate */
.mini{min-width:52px;min-height:48px;font-size:22px;font-weight:800;border-radius:10px;border:2px solid var(--line);background:#fff;margin:2px;cursor:pointer}
.mini.ok{color:var(--ok)} .mini.mal{color:var(--err)}
.mini.lleno.ok{background:var(--ok-bg);border-color:var(--ok)}
.mini.lleno.mal{background:var(--err-bg);border-color:var(--err)}
.gana{font-size:18px;font-weight:800;color:var(--verde)}

/* Récords */
.records{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.records>div{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.records b{display:block;font-size:30px;line-height:1.1}
.records span{font-size:14px;color:var(--muted)}

/* Login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--verde)}
.login-caja{background:#fff;border-radius:16px;padding:28px;max-width:420px;width:100%}
.login-caja h1{margin:10px 0 4px;font-size:28px}
.login-caja form{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.linkbtn{background:none;border:0;color:var(--verde);font-weight:600;font-size:15px;padding:8px 0;cursor:pointer;text-align:left;font-family:inherit}
.msg{font-size:14px;margin-top:10px;color:var(--err)}
.msg.bien{color:var(--verde)}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#15261b;color:#fff;padding:12px 18px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw}
#toast.ver{opacity:1}

@media (max-width:700px){
  .form-grid,.ganadores{grid-template-columns:1fr}
  .top nav a{padding:10px 8px;font-size:14px}
  h2{font-size:21px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
'use strict';
// =====================================================================
// Reglas fijas del Kick Challenge
// =====================================================================
const EST = [
  {n:1, nombre:'Medio 25Y',      tipo:'normal'},
  {n:2, nombre:'Izq 15Y',        tipo:'normal'},
  {n:3, nombre:'Izq 5Y',         tipo:'normal'},
  {n:4, nombre:'Der 15Y',        tipo:'normal'},
  {n:5, nombre:'Der 5Y (Rumor)', tipo:'normal'},
  {n:6, nombre:'Medio 45Y',      tipo:'normal'},
  {n:7, nombre:'Ingoal palo',    tipo:'palo'},
  {n:8, nombre:'Drop medio 35Y', tipo:'drop'},
];
const PTS_NORMAL = [0,1,3];   // ninguno / uno / los dos
const PTS_PALO   = [0,3,9];   // estación 7
const BONUS_RACHA = 3;        // 3 estaciones seguidas con puntaje máximo
const RES = {
  entro:{txt:'✓', cls:'ok'},
  izq:  {txt:'←', cls:'mal'},
  der:  {txt:'→', cls:'mal'},
  corta:{txt:'↓', cls:'mal'},
  erro: {txt:'✗', cls:'mal'},
};

// ==CORE== (cálculo de puntajes y desempates)
function puntosEstacion(est, aciertos){ return (est===7 ? PTS_PALO : PTS_NORMAL)[aciertos]; }

function calcularEdicion(parejas, patadas){
  const mapa = new Map();
  for (const p of patadas) mapa.set(p.jugador_id+'|'+p.estacion, p.resultado);
  const res = (j,s) => mapa.get(j+'|'+s) || null;
  const outP = [], outJ = [];
  for (const p of parejas){
    const st = [];
    for (let s=1; s<=8; s++){
      const r1 = res(p.jugador1_id,s), r2 = res(p.jugador2_id,s);
      const hits = (r1==='entro'?1:0) + (r2==='entro'?1:0);
      st.push({s, r1, r2, hits, pts:puntosEstacion(s,hits), max:hits===2, cargada:!!(r1&&r2)});
    }
    const rachas = [], enRacha = new Set();
    for (let i=0; i<=5; i++){
      if (st[i].max && st[i+1].max && st[i+2].max){
        rachas.push(i+1); enRacha.add(i+1); enRacha.add(i+2); enRacha.add(i+3);
      }
    }
    const base = st.reduce((a,x)=>a+x.pts,0);
    const bonus = rachas.length*BONUS_RACHA;
    outP.push({pareja:p, st, rachas, enRacha, base, bonus, total:base+bonus, cargadas:st.filter(x=>x.cargada).length});
    for (const [jid,k] of [[p.jugador1_id,'r1'],[p.jugador2_id,'r2']]){
      outJ.push({jugador_id:jid, pareja_id:p.id,
        aciertos: st.filter(x=>x[k]==='entro').length,
        patadas:  st.filter(x=>x[k]).length});
    }
  }
  return {parejas:outP, jugadores:outJ};
}

// items: [{id,total}] · desempates: filas de kc_desempates de un tipo
function resolverGanador(items, desempates){
  if (!items.length) return {estado:'vacio', ganador:null, empatados:[], rondas:[]};
  const top = Math.max(...items.map(i=>i.total));
  const empatados = items.filter(i=>i.total===top).map(i=>i.id);
  if (empatados.length===1) return {estado:'unico', ganador:empatados[0], empatados, rondas:[]};
  const porRonda = new Map();
  for (const d of desempates){
    if (!porRonda.has(d.ronda)) porRonda.set(d.ronda, new Map());
    porRonda.get(d.ronda).set(d.participante_id, d.acierto);
  }
  let vivos = [...empatados]; const rondas = [];
  for (let r=1; r<200; r++){
    const m = porRonda.get(r) || new Map();
    const completa = vivos.every(id=>m.has(id));
    rondas.push({ronda:r, vivos:[...vivos], resultados:m, completa});
    if (!completa) break;
    const pasan = vivos.filter(id=>m.get(id));
    if (pasan.length>0) vivos = pasan;          // si fallan todos, siguen todos
    if (vivos.length===1) return {estado:'resuelto', ganador:vivos[0], empatados, rondas};
  }
  return {estado:'empate', ganador:null, empatados, rondas};
}
// ==/CORE==

// =====================================================================
// Estado local + sincronización con Supabase (funciona sin señal)
// =====================================================================
const CFG = window.KC_CONFIG || {};
const TABLAS = ['kc_perfil','kc_jugadores','kc_ediciones','kc_parejas','kc_patadas','kc_desempates'];
const CONFLICTO = {kc_perfil:'user_id', kc_patadas:'edicion_id,jugador_id,estacion', kc_desempates:'edicion_id,tipo,ronda,participante_id'};
let sb = null, UID = null, META = {}, S = vacio(), COLA = [], sincronizando = false, bajadoOk = false;
let UI = {statsEd:'todas', statsJug:'', modo:'ingresar', msg:'', msgBien:false};
let modalCtx = null, parCtx = null;

function vacio(){ const o={}; TABLAS.forEach(t=>o[t]=[]); return o; }
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function guardarLocal(){ lsSet('kc_cache_'+UID, S); lsSet('kc_cola_'+UID, COLA); }
function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = crypto.getRandomValues(new Uint8Array(1))[0]%16;
    return (c==='x' ? r : (r&3|8)).toString(16);
  });
}
function coincide(row,match){ return Object.entries(match).every(([k,v])=>row[k]===v); }

function aplicarLocal(o){
  const arr = S[o.t];
  if (o.op==='upsert'){
    const r = o.row; let i;
    if (o.t==='kc_patadas') i = arr.findIndex(x=>x.edicion_id===r.edicion_id && x.jugador_id===r.jugador_id && x.estacion===r.estacion);
    else if (o.t==='kc_desempates') i = arr.findIndex(x=>x.edicion_id===r.edicion_id && x.tipo===r.tipo && x.ronda===r.ronda && x.participante_id===r.participante_id);
    else if (o.t==='kc_perfil') i = arr.findIndex(x=>x.user_id===r.user_id);
    else i = arr.findIndex(x=>x.id===r.id);
    if (i>=0) arr[i] = {...arr[i], ...r}; else arr.push({...r});
  } else {
    S[o.t] = arr.filter(x=>!coincide(x,o.match));
    if (o.t==='kc_ediciones'){
      const id=o.match.id;
      ['kc_parejas','kc_patadas','kc_desempates'].forEach(t=>S[t]=S[t].filter(x=>x.edicion_id!==id));
    }
    if (o.t==='kc_parejas'){
      const id=o.match.id;
      S.kc_patadas = S.kc_patadas.filter(x=>x.pareja_id!==id);
      S.kc_desempates = S.kc_desempates.filter(x=>x.participante_id!==id);
    }
  }
}

function cambiar(t, op, data){
  const o = op==='upsert' ? {t, op, row:{...data, user_id:UID}} : {t, op, match:data};
  aplicarLocal(o); COLA.push(o); guardarLocal(); render(); sincronizar();
}

async function sincronizar(){
  if (sincronizando || !sb || !UID) return;
  if (!navigator.onLine){ pintarSync(); return; }
  sincronizando = true; pintarSync();
  while (COLA.length){
    const o = COLA[0]; let res;
    try{
      if (o.op==='upsert') res = await sb.from(o.t).upsert(o.row, {onConflict: CONFLICTO[o.t]||'id'});
      else { let q = sb.from(o.t).delete(); for (const [k,v] of Object.entries(o.match)) q = q.eq(k,v); res = await q; }
    }catch(e){ res = {error:e, status:0}; }
    if (res.error){
      const st = res.status||0;
      if (st===0 || st===401 || st===408 || st===429 || st>=500){
        if (st===401){ try{ await sb.auth.refreshSession(); }catch(e){} }
        break;   // se reintenta más tarde
      }
      console.error('No se pudo guardar', o, res.error);
      toast('No se pudo guardar un cambio: '+res.error.message);
    }
    COLA.shift(); guardarLocal();
  }
  sincronizando = false; pintarSync();
}

async function bajarTabla(t){
  const out=[]; const N=1000;
  for (let desde=0; ; desde+=N){
    const {data, error} = await sb.from(t).select('*').range(desde, desde+N-1);
    if (error) throw error;
    out.push(...data);
    if (data.length<N) break;
  }
  return out;
}
async function bajar(){
  if (!navigator.onLine || !sb || !UID) return;
  await sincronizar();
  if (COLA.length) return;               // no pisar cambios que todavía no subieron
  try{
    const res = await Promise.all(TABLAS.map(bajarTabla));
    const n = vacio(); TABLAS.forEach((t,i)=>n[t]=res[i]);
    S = n; bajadoOk = true; guardarLocal(); render();
  }catch(e){ console.warn('No se pudo actualizar', e); }
}
function asegurarPerfil(){
  if (bajadoOk && !S.kc_perfil.length) cambiar('kc_perfil','upsert',{nombre: META.competencia || 'Mi competencia'});
}

function pintarSync(){
  const el = document.getElementById('sync'); if (!el) return;
  const n = COLA.length;
  if (!navigator.onLine){ el.className='sync off'; el.textContent = n ? `Sin conexión (${n} sin subir)` : 'Sin conexión'; }
  else if (sincronizando){ el.className='sync pend'; el.textContent='Guardando…'; }
  else if (n){ el.className='sync pend'; el.textContent=`${n} sin subir`; }
  else { el.className='sync'; el.textContent='Todo guardado'; }
}

// =====================================================================
// Utilidades
// =====================================================================
const $app = document.getElementById('app');
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hoy(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function fmtFecha(f){ if(!f) return ''; const [y,m,d]=f.split('-'); return `${d}/${m}/${y}`; }
function pct(a,n){ return n ? Math.round(100*a/n) : null; }
function pctTxt(a,n){ const p=pct(a,n); return p===null ? '–' : `${p}%<span class="barra"><i style="width:${p}%"></i></span>`; }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('ver'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('ver'),3500); }
function ruta(){ return location.hash.replace(/^#\/?/,'').split('/'); }
function ir(h){ location.hash = h; }

function jug(id){ return S.kc_jugadores.find(j=>j.id===id); }
function nombreJ(id){ return jug(id)?.nombre || '¿?'; }
function pareja(id){ return S.kc_parejas.find(p=>p.id===id); }
function nombrePareja(p){ return p ? `${nombreJ(p.jugador1_id)} / ${nombreJ(p.jugador2_id)}` : '¿?'; }
function nombreParejaId(id){ return nombrePareja(pareja(id)); }
function edicion(id){ return S.kc_ediciones.find(e=>e.id===id); }
function parejasDe(edId){ return S.kc_parejas.filter(p=>p.edicion_id===edId).sort((a,b)=>a.numero-b.numero); }
function edicionesOrdenadas(){ return [...S.kc_ediciones].sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'') || (b.nombre||'').localeCompare(a.nombre||'')); }

function resumen(ed){
  const parejas = parejasDe(ed.id);
  const pats = S.kc_patadas.filter(p=>p.edicion_id===ed.id);
  const c = calcularEdicion(parejas, pats);
  const completa = parejas.length>0 && c.parejas.every(x=>x.cargadas===8);
  const des = S.kc_desempates.filter(d=>d.edicion_id===ed.id);
  const nada = {estado:'vacio', ganador:null, empatados:[], rondas:[]};
  const gp = pats.length ? resolverGanador(c.parejas.map(x=>({id:x.pareja.id, total:x.total})), des.filter(d=>d.tipo==='pareja')) : nada;
  const gi = pats.length ? resolverGanador(c.jugadores.map(x=>({id:x.jugador_id, total:x.aciertos})), des.filter(d=>d.tipo==='individual')) : nada;
  return {ed, parejas, pats, c, completa, gp, gi};
}
function textoGanador(g, completa, nom){
  if (g.estado==='vacio') return 'Sin patadas cargadas';
  if (g.estado==='unico') return (completa ? '🏆 ' : 'Va ganando: ') + nom(g.ganador);
  if (g.estado==='resuelto') return '🏆 ' + nom(g.ganador) + ' (muerte súbita)';
  return (completa ? 'Empate: ' : 'Van empatados: ') + g.empatados.map(nom).join(', ');
}
function ganadorDefinido(R, g){ return R.completa && (g.estado==='unico' || g.estado==='resuelto') ? g.ganador : null; }

function render(){
  if (!sb) return;
  if (!UID){ $app.innerHTML = vistaLogin(); return; }
  const prevScroll = [...document.querySelectorAll('.scroll')].map(e=>e.scrollLeft);
  const r = ruta(); let html;
  switch (r[0]){
    case 'jugadores': html = vistaJugadores(); break;
    case 'estadisticas': html = vistaStats(); break;
    case 'ed': {
      const ed = edicion(r[1]);
      if (!ed){ html = vistaEdiciones(); break; }
      html = r[2]==='editar' ? vistaEditar(ed) : vistaEdicion(ed, r[2]||'planilla');
      break;
    }
    default: html = vistaEdiciones();
  }
  $app.innerHTML = header(r) + `<main>${html}</main>`;
  document.querySelectorAll('.scroll').forEach((e,i)=>{ if (prevScroll[i]) e.scrollLeft = prevScroll[i]; });
  pintarSync();
}

function header(r){
  const nom = S.kc_perfil[0]?.nombre || 'Kick Challenge';
  const sec = r[0]||'';
  const on = x => (x===sec || (x==='' && (sec===''||sec==='ed'))) ? 'on' : '';
  return `<header class="top">
    <button class="comp" data-a="renombrarComp" title="Cambiar el nombre de la competencia">${esc(nom)}</button>
    <nav><a href="#/" class="${on('')}">Ediciones</a><a href="#/jugadores" class="${on('jugadores')}">Jugadores</a><a href="#/estadisticas" class="${on('estadisticas')}">Estadísticas</a></nav>
    <span id="sync" class="sync"></span>
    <button class="salir" data-a="salir">Salir</button>
  </header>`;
}

// ---------- Ediciones ----------
function vistaEdiciones(){
  const eds = edicionesOrdenadas();
  let h = `<div class="barra-tit"><h2>Ediciones</h2><button class="btn pri" data-a="nuevaEd">Nueva edición</button></div>`;
  if (!eds.length) return h + `<div class="panel"><p>Todavía no hay ediciones. Creá la primera para armar las parejas y empezar a cargar patadas.</p></div>`;
  h += '<div class="lista-ed">';
  for (const ed of eds){
    const R = resumen(ed);
    h += `<a class="ed-card" href="#/ed/${ed.id}">
      <div class="ed-top"><strong>${esc(ed.nombre)}</strong><span class="chip ${ed.finalizada?'fin':'curso'}">${ed.finalizada?'Finalizada':'En curso'}</span></div>
      <div class="muted">${fmtFecha(ed.fecha)}, ${R.parejas.length} parejas</div>
      <div class="ed-gan"><span>Parejas</span>${esc(textoGanador(R.gp, R.completa, nombreParejaId))}</div>
      <div class="ed-gan"><span>Individual</span>${esc(textoGanador(R.gi, R.completa, nombreJ))}</div>
    </a>`;
  }
  return h + '</div>';
}

  let h = `<a class="volver" href="#/ed/${ed.id}">‹ Volver a la edición</a>
    <div class="barra-tit"><h2>Editar edición</h2></div>
    <div class="panel form-grid">
      <label>Nombre<input value="${esc(ed.nombre)}" data-c="edNombre" data-id="${ed.id}"></label>
      <label>Fecha<input type="date" value="${esc(ed.fecha)}" data-c="edFecha" data-id="${ed.id}"></label>
    </div>
    <div class="panel"><div class="barra-tit"><h3 style="margin:0">Parejas (${pars.length})</h3>
      <button class="btn pri" data-a="parejaModal" data-ed="${ed.id}">Agregar pareja</button></div>`;
  if (!pars.length) h += '<p class="muted">Agregá las parejas que van a patear. Los jugadores quedan guardados para las próximas ediciones.</p>';
  else {
    h += '<table class="t"><thead><tr><th>#</th><th>Jugadores</th><th class="num">Patadas</th><th></th></tr></thead><tbody>';
    for (const p of pars){
      const n = S.kc_patadas.filter(x=>x.pareja_id===p.id).length;

        <td><div class="acc" style="justify-content:flex-end">
          ${n ? '' : `<button class="btn chico" data-a="parejaModal" data-ed="${ed.id}" data-id="${p.id}">Cambiar</button>`}
          <button class="btn chico peligro" data-a="borrarPareja" data-id="${p.id}">Borrar</button></div></td></tr>`;
    }
    h += '</tbody></table>';
  }
  h += `</div><div class="acciones"><a class="btn pri" href="#/ed/${ed.id}">Ir a la planilla</a>
    <button class="btn peligro" data-a="borrarEd" data-id="${ed.id}">Borrar edición</button></div>`;
  return h;
}

function vistaEdicion(ed, tab){
  const R = resumen(ed);
  let h = `<a class="volver" href="#/">‹ Ediciones</a>
    <div class="barra-tit"><div><h2>${esc(ed.nombre)}</h2><div class="muted">${fmtFecha(ed.fecha)}${ed.finalizada?', finalizada':''}</div></div>
      <div class="acc"><a class="btn" href="#/ed/${ed.id}/editar">Editar</a>
      ${ed.finalizada ? `<button class="btn" data-a="reabrir" data-id="${ed.id}">Reabrir</button>` : `<button class="btn pri" data-a="finalizar" data-id="${ed.id}">Finalizar</button>`}</div></div>`;
  if (!R.parejas.length) return h + `<div class="panel"><p>Esta edición todavía no tiene parejas.</p><a class="btn pri" href="#/ed/${ed.id}/editar">Armar parejas</a></div>`;
  const hayEmpate = R.completa && (R.gp.estado==='empate' || R.gi.estado==='empate');
  h += `<div class="ganadores">
      <div><span>Premio por parejas</span><strong>${esc(textoGanador(R.gp, R.completa, nombreParejaId))}</strong></div>
      <div><span>Mejor pateador individual</span><strong>${esc(textoGanador(R.gi, R.completa, nombreJ))}</strong></div></div>
    <div class="tabs">
      <a href="#/ed/${ed.id}/planilla" class="${tab==='planilla'?'on':''}">Planilla</a>
      <a href="#/ed/${ed.id}/posiciones" class="${tab==='posiciones'?'on':''}">Posiciones</a>
      <a href="#/ed/${ed.id}/desempate" class="${tab==='desempate'?'on':''}">Desempate${hayEmpate?'<b class="punto">!</b>':''}</a></div>`;

  else if (tab==='desempate') h += vistaDesempate(R);

function vistaPlanilla(R){
  const ro = R.ed.finalizada;
  let h = ro ? '<p class="aviso">La edición está finalizada. Reabrila para modificar patadas.</p>'
             : '<p class="muted ayuda">Tocá una casilla para cargar la patada. En verde, las rachas de 3 estaciones seguidas con puntaje máximo.</p>';
  h += `<div class="scroll"><table class="planilla"><thead><tr><th>#</th><th class="th-nom">Jugador</th>
    ${EST.map(e=>`<th>${e.n}<span>${esc(e.nombre)}</span></th>`).join('')}<th>Ind.</th><th>Equipo</th></tr></thead><tbody>`;
  for (const x of R.c.parejas){
    const p = x.pareja;
    const ind = R.c.jugadores.filter(j=>j.pareja_id===p.id);
    const fila = (jid,k) => x.st.map(st=>{
      const d = st[k] ? RES[st[k]] : null;
      const cls = `celda ${d?d.cls:'vacia'} ${x.enRacha.has(st.s)?'racha':''} ${ro?'ro':''}`;
      const attrs = ro ? '' : `data-a="celda" data-p="${p.id}" data-j="${jid}" data-s="${st.s}" role="button" tabindex="0"`;
      return `<td class="${cls}" ${attrs}>${d?d.txt:''}</td>`;
    }).join('');
    h += `<tr><td rowspan="3" class="nro">${p.numero}</td><td class="nom">${esc(nombreJ(p.jugador1_id))}</td>${fila(p.jugador1_id,'r1')}
      <td class="tot">${ind[0].aciertos}</td>
      <td rowspan="3" class="toteq">${x.total}${x.bonus?`<small>+${x.bonus} por racha${x.rachas.length>1?'s':''}</small>`:''}</td></tr>
      <tr><td class="nom">${esc(nombreJ(p.jugador2_id))}</td>${fila(p.jugador2_id,'r2')}<td class="tot">${ind[1].aciertos}</td></tr>
      <tr class="pts"><td class="nom sub">Puntos</td>${x.st.map(st=>`<td class="${st.max?'max':''} ${x.enRacha.has(st.s)?'racha':''}">${st.cargada?st.pts:''}</td>`).join('')}<td></td></tr>`;
  }
  h += `</tbody></table></div>
    <div class="leyenda"><span><b class="ok">✓</b> Entró / pegó en el palo</span><span><b class="mal">←</b> Izquierda</span>
    <span><b class="mal">↓</b> Corta</span><span><b class="mal">→</b> Derecha</span><span><b class="mal">✗</b> Erró sin dato</span><span><i></i>Racha</span></div>`;
  return h;
}

function ordenarConGanador(items, ganadorId){
  return items.sort((a,b)=> b.total-a.total || (a.id===ganadorId?-1:b.id===ganadorId?1:0));
}
function conPuesto(items){ return items.map(it=>({...it, pos:1+items.filter(o=>o.total>it.total).length})); }

function vistaPosiciones(R){
  const gp = ganadorDefinido(R,R.gp), gi = ganadorDefinido(R,R.gi);
  const ps = conPuesto(ordenarConGanador(R.c.parejas.map(x=>({id:x.pareja.id, total:x.total, x})), gp));
  let h = `<div class="panel"><h3>Parejas</h3><div class="scroll"><table class="t"><thead><tr><th>Pos.</th><th>Pareja</th>
    <th class="num">Estaciones</th><th class="num">Rachas</th><th class="num">Total</th></tr></thead><tbody>`;
  for (const it of ps){
    h += `<tr class="${it.id===gp?'gana':''}"><td>${it.id===gp?'🏆':it.pos}</td><td>${esc(nombrePareja(it.x.pareja))}</td>
      <td class="num">${it.x.base}</td><td class="num">${it.x.rachas.length ? `${it.x.rachas.length} (+${it.x.bonus})` : '–'}</td>
      <td class="num"><strong>${it.total}</strong></td></tr>`;
  }
  h += '</tbody></table></div></div>';
  const js = conPuesto(ordenarConGanador(R.c.jugadores.map(j=>({id:j.jugador_id, total:j.aciertos, j})), gi));
  h += `<div class="panel"><h3>Individual</h3><div class="scroll"><table class="t"><thead><tr><th>Pos.</th><th>Jugador</th>
    <th class="num">Aciertos</th><th class="num">Patadas</th><th>Efectividad</th></tr></thead><tbody>`;
  for (const it of js){
    h += `<tr class="${it.id===gi?'gana':''}"><td>${it.id===gi?'🎯':it.pos}</td><td>${esc(nombreJ(it.id))}</td>
      <td class="num"><strong>${it.j.aciertos}</strong></td><td class="num">${it.j.patadas}/8</td><td>${pctTxt(it.j.aciertos, it.j.patadas)}</td></tr>`;
  }
  return h + '</tbody></table></div></div>';
}

function vistaDesempate(R){
  if (!R.completa) return '<div class="panel"><p>El desempate se habilita cuando están cargadas todas las patadas.</p></div>';
  return bloqueDes(R,'pareja',R.gp,nombreParejaId) + bloqueDes(R,'individual',R.gi,nombreJ) +
    '<p class="muted ayuda">Cada uno patea desde la ubicación que define la organización. Si convierte sigue, si falla queda eliminado. Si en una ronda fallan todos, siguen todos.</p>';
}
function bloqueDes(R, tipo, g, nom){
  const tit = tipo==='pareja' ? 'Premio por parejas' : 'Mejor pateador individual';
  if (g.estado==='vacio') return '';
  if (g.estado==='unico') return `<div class="panel"><h3>${tit}</h3><p>Sin empate. Ganó <strong>${esc(nom(g.ganador))}</strong>.</p></div>`;
  const ro = R.ed.finalizada;
  let h = `<div class="panel"><h3>${tit}</h3>` + (g.estado==='resuelto'
    ? `<p class="gana">🏆 Ganó ${esc(nom(g.ganador))}</p>`
    : '<p>Empatados en el primer puesto. Cargá la muerte súbita ronda por ronda.</p>');
  h += `<div class="scroll"><table class="t"><thead><tr><th>${tipo==='pareja'?'Pareja':'Jugador'}</th>
    ${g.rondas.map(r=>`<th class="c">Ronda ${r.ronda}</th>`).join('')}</tr></thead><tbody>`;
  for (const id of g.empatados){
    h += `<tr><td>${esc(nom(id))}</td>`;
    for (const r of g.rondas){
      if (!r.vivos.includes(id)){ h += '<td class="c muted">–</td>'; continue; }
      const v = r.resultados.get(id);
      const base = `data-tipo="${tipo}" data-ronda="${r.ronda}" data-part="${id}" data-ed="${R.ed.id}"`;
      if (v===undefined) h += ro ? '<td class="c muted">·</td>'
        : `<td class="c"><button class="mini ok" data-a="des" data-v="1" ${base} aria-label="Convirtió">✓</button><button class="mini mal" data-a="des" data-v="0" ${base} aria-label="Falló">✗</button></td>`;
      else h += `<td class="c"><button class="mini lleno ${v?'ok':'mal'}" data-a="des" data-v="del" ${base} ${ro?'disabled':''} title="Tocar para borrar">${v?'✓':'✗'}</button></td>`;
    }
    h += '</tr>';
  }
  return h + '</tbody></table></div></div>';
}

// ---------- Jugadores ----------
function vistaJugadores(){
  const js = [...S.kc_jugadores].sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const info = id => {
    const ps = S.kc_patadas.filter(p=>p.jugador_id===id);
    const eds = new Set(S.kc_parejas.filter(p=>p.jugador1_id===id||p.jugador2_id===id).map(p=>p.edicion_id));
    return {n:ps.length, ac:ps.filter(p=>p.resultado==='entro').length, eds:eds.size};
  };
  let h = `<div class="barra-tit"><h2>Jugadores</h2></div>
    <form class="panel fila-form" data-f="nuevoJug"><input name="nombre" placeholder="Nombre del jugador" required><button class="btn pri">Agregar jugador</button></form>`;
  if (!js.length) return h + '<div class="panel"><p class="muted">Todavía no hay jugadores. También podés agregarlos al armar las parejas.</p></div>';
  const tabla = (lista, tit) => {
    if (!lista.length) return '';
    let t = `<div class="panel"><h3>${tit}</h3><div class="scroll"><table class="t"><thead><tr><th>Nombre</th><th class="num">Ediciones</th>
      <th class="num">Patadas</th><th>Efectividad</th><th></th></tr></thead><tbody>`;
    for (const j of lista){
      const i = info(j.id);
      t += `<tr><td>${esc(j.nombre)}</td><td class="num">${i.eds}</td><td class="num">${i.n}</td><td>${pctTxt(i.ac,i.n)}</td>
        <td><div class="acc" style="justify-content:flex-end">
          <button class="btn chico" data-a="renJug" data-id="${j.id}">Renombrar</button>
          <button class="btn chico" data-a="archJug" data-id="${j.id}">${j.activo?'Archivar':'Reactivar'}</button>
          ${i.eds ? '' : `<button class="btn chico peligro" data-a="borrJug" data-id="${j.id}">Borrar</button>`}</div></td></tr>`;
    }
    return t + '</tbody></table></div></div>';
  };
  return h + tabla(js.filter(j=>j.activo),'Activos') + tabla(js.filter(j=>!j.activo),'Archivados (no aparecen al armar parejas)');
}

// ---------- Estadísticas ----------
function contarErradas(ps){
  return {izq:ps.filter(p=>p.resultado==='izq').length, corta:ps.filter(p=>p.resultado==='corta').length, der:ps.filter(p=>p.resultado==='der').length};
}
function tendencia(c){
  const n = c.izq + c.corta + c.der;
  if (n<5) return `Pocas erradas con dirección cargada (${n}) para ver una tendencia.`;
  const arr = [['a la izquierda',c.izq],['corta',c.corta],['a la derecha',c.der]].sort((a,b)=>b[1]-a[1]);
  if (arr[0][1]/n>=0.5 && arr[0][1]>=1.5*arr[1][1]) return `Tendencia: cuando erra, la tira ${arr[0][0]} (${arr[0][1]} de ${n}).`;
  return `Sin tendencia clara: reparte las erradas (${n} con dirección cargada).`;
}
function tablaEstaciones(ps){
  const filas = EST.map(e=>{
    const a = ps.filter(p=>p.estacion===e.n);
    return {e, n:a.length, ac:a.filter(p=>p.resultado==='entro').length, ...contarErradas(a)};
  });
  const conDatos = filas.filter(f=>f.n>0);
  const ef = conDatos.map(f=>f.ac/f.n);
  const minEf = Math.min(...ef), maxEf = Math.max(...ef);
  const esPeor = f => f.n>0 && conDatos.length>1 && minEf<maxEf && f.ac/f.n===minEf;
  let h = `<div class="scroll"><table class="t"><thead><tr><th>Estación</th><th class="num">Patadas</th><th>Efectividad</th>
    <th class="num">Izq</th><th class="num">Corta</th><th class="num">Der</th></tr></thead><tbody>`;
  for (const f of filas){
    h += `<tr><td>${f.e.n}. ${esc(f.e.nombre)}${esPeor(f)?'<span class="tag">la más difícil</span>':''}</td>
      <td class="num">${f.n}</td><td>${pctTxt(f.ac,f.n)}</td><td class="num">${f.izq||'–'}</td>
      <td class="num">${f.e.tipo==='palo'?'':(f.corta||'–')}</td><td class="num">${f.der||'–'}</td></tr>`;
  }
  return h + '</tbody></table></div>';
}

function vistaStats(){
  const eds = edicionesOrdenadas();
  if (!eds.length) return '<h2>Estadísticas</h2><div class="panel" style="margin-top:14px"><p>Cuando haya ediciones cargadas vas a ver acá el historial.</p></div>';
  if (UI.statsEd!=='todas' && !edicion(UI.statsEd)) UI.statsEd = 'todas';
  const sel = UI.statsEd==='todas' ? eds : eds.filter(e=>e.id===UI.statsEd);
  const ids = new Set(sel.map(e=>e.id));
  const pats = S.kc_patadas.filter(p=>ids.has(p.edicion_id));
  const Rs = sel.map(resumen).filter(R=>R.pats.length);
  let h = `<div class="barra-tit"><h2>Estadísticas</h2>
    <select data-c="statsEd" style="width:auto;min-width:240px"><option value="todas">Todas las ediciones</option>
    ${eds.map(e=>`<option value="${e.id}" ${UI.statsEd===e.id?'selected':''}>${esc(e.nombre)} (${fmtFecha(e.fecha)})</option>`).join('')}</select></div>`;
  if (!Rs.length) return h + '<div class="panel"><p>No hay patadas cargadas en esta selección.</p></div>';

  // Campeones por edición
  h += `<div class="panel"><h3>Campeones</h3><div class="scroll"><table class="t"><thead><tr><th>Edición</th><th>Fecha</th>
    <th>Pareja ganadora</th><th class="num">Pts</th><th>Mejor pateador</th><th class="num">Aciertos</th></tr></thead><tbody>`;
  for (const R of Rs){
    const gp = ganadorDefinido(R,R.gp), gi = ganadorDefinido(R,R.gi);
    const ptsP = Math.max(...R.c.parejas.map(x=>x.total)), acI = Math.max(...R.c.jugadores.map(x=>x.aciertos));
    h += `<tr><td>${esc(R.ed.nombre)}</td><td>${fmtFecha(R.ed.fecha)}</td>
      <td>${gp ? esc(nombreParejaId(gp)) : `<span class="muted">${esc(textoGanador(R.gp,R.completa,nombreParejaId))}</span>`}</td><td class="num">${ptsP}</td>
      <td>${gi ? esc(nombreJ(gi)) : `<span class="muted">${esc(textoGanador(R.gi,R.completa,nombreJ))}</span>`}</td><td class="num">${acI}</td></tr>`;
  }
  h += '</tbody></table></div></div>';

  // Récords
  let bp=null, bi=null, br=null, rachasTot=0;
  for (const R of Rs){
    for (const x of R.c.parejas){ rachasTot += x.rachas.length;
      if (!bp || x.total>bp.v) bp = {v:x.total, t:nombrePareja(x.pareja), ed:R.ed.nombre};
      if (!br || x.rachas.length>br.v) br = {v:x.rachas.length, t:nombrePareja(x.pareja), ed:R.ed.nombre}; }
    for (const j of R.c.jugadores) if (!bi || j.aciertos>bi.v) bi = {v:j.aciertos, t:nombreJ(j.jugador_id), ed:R.ed.nombre};
  }
  h += `<div class="panel"><h3>Récords</h3><div class="records">
    <div><b>${bp.v}</b><span>Mejor puntaje de pareja: ${esc(bp.t)} (${esc(bp.ed)})</span></div>
    <div><b>${bi.v}/8</b><span>Mejor individual: ${esc(bi.t)} (${esc(bi.ed)})</span></div>
    <div><b>${br.v}</b><span>Más rachas en una edición${br.v?`: ${esc(br.t)} (${esc(br.ed)})`:''}</span></div>
    <div><b>${pct(pats.filter(p=>p.resultado==='entro').length, pats.length)}%</b><span>Efectividad general (${pats.length} patadas, ${rachasTot} rachas)</span></div>
  </div></div>`;

  // Ranking histórico individual
  const ag = new Map();
  for (const R of Rs){
    for (const j of R.c.jugadores){
      if (!j.patadas) continue;
      const a = ag.get(j.jugador_id) || {id:j.jugador_id, ed:0, pat:0, ac:0, tP:0, tI:0};
      a.ed++; a.pat += j.patadas; a.ac += j.aciertos; ag.set(j.jugador_id, a);
    }
    const gp = ganadorDefinido(R,R.gp), gi = ganadorDefinido(R,R.gi);
    if (gi && ag.get(gi)) ag.get(gi).tI++;
    if (gp){ const p = pareja(gp); [p.jugador1_id,p.jugador2_id].forEach(id=>{ if (ag.get(id)) ag.get(id).tP++; }); }
  }
  const rank = [...ag.values()].sort((a,b)=> b.ac-a.ac || b.ac/b.pat - a.ac/a.pat);
  h += `<div class="panel"><h3>Ranking individual</h3><div class="scroll"><table class="t"><thead><tr><th>Jugador</th><th class="num">Ediciones</th>
    <th class="num">Aciertos</th><th class="num">Patadas</th><th>Efectividad</th><th class="num">🏆 Pareja</th><th class="num">🎯 Individual</th></tr></thead><tbody>`;
  for (const a of rank) h += `<tr><td>${esc(nombreJ(a.id))}</td><td class="num">${a.ed}</td><td class="num"><strong>${a.ac}</strong></td>
    <td class="num">${a.pat}</td><td>${pctTxt(a.ac,a.pat)}</td><td class="num">${a.tP||'–'}</td><td class="num">${a.tI||'–'}</td></tr>`;
  h += '</tbody></table></div></div>';

  // Por estación
  h += `<div class="panel"><h3>Por estación</h3><p class="muted ayuda">Las columnas Izq, Corta y Der cuentan solo las erradas con dirección cargada.</p>${tablaEstaciones(pats)}</div>`;

  // Por jugador
  const lista = rank.map(a=>a.id);
  if (!lista.includes(UI.statsJug)) UI.statsJug = lista[0];
  const jid = UI.statsJug;
  const pj = pats.filter(p=>p.jugador_id===jid);
  const ce = contarErradas(pj);
  h += `<div class="panel"><div class="barra-tit"><h3 style="margin:0">Por jugador</h3>
    <select data-c="statsJug" style="width:auto;min-width:220px">${lista.map(id=>`<option value="${id}" ${id===jid?'selected':''}>${esc(nombreJ(id))}</option>`).join('')}</select></div>
    <p><strong>${pj.filter(p=>p.resultado==='entro').length}</strong> aciertos en ${pj.length} patadas (${pct(pj.filter(p=>p.resultado==='entro').length,pj.length)}%).
    Erradas: ${ce.izq} a la izquierda, ${ce.corta} cortas, ${ce.der} a la derecha.</p>
    <p class="aviso">${esc(tendencia(ce))}</p>${tablaEstaciones(pj)}`;
  if (Rs.length>1){
    h += `<h3 style="margin-top:18px">Edición por edición</h3><div class="scroll"><table class="t"><thead><tr><th>Edición</th><th>Fecha</th>
      <th class="num">Aciertos</th><th>Pareja</th><th class="num">Pts pareja</th><th class="num">Puesto</th></tr></thead><tbody>`;
    for (const R of Rs){
      const j = R.c.jugadores.find(x=>x.jugador_id===jid); if (!j) continue;
      const pp = conPuesto(R.c.parejas.map(x=>({id:x.pareja.id,total:x.total}))).find(x=>x.id===j.pareja_id);
      const gp = ganadorDefinido(R,R.gp);
      h += `<tr><td>${esc(R.ed.nombre)}</td><td>${fmtFecha(R.ed.fecha)}</td><td class="num">${j.aciertos}/${j.patadas}</td>
        <td>${esc(nombreParejaId(j.pareja_id))}</td><td class="num">${pp.total}</td><td class="num">${gp===j.pareja_id?'🏆':pp.pos}</td></tr>`;
    }
    h += '</tbody></table></div>';
  }
  return h + '</div>';
}

// =====================================================================
// Modales
// =====================================================================
function abrirModal(html){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  root.querySelector('.modal-bg').addEventListener('click', e=>{ if (e.target.classList.contains('modal-bg')) cerrarModal(); });
  const f = root.querySelector('input,button'); if (f && f.tagName==='INPUT') f.focus();
}
function cerrarModal(){ document.getElementById('modal-root').innerHTML=''; modalCtx=null; parCtx=null; }

function confirmar(texto, boton, fn){
  modalCtx = {fn};
  abrirModal(`<h3>¿Seguro?</h3><p>${esc(texto)}</p><div class="fila-sec"><button class="btn pri peligro-pri" data-a="confOk" style="background:var(--err);border-color:var(--err)">${esc(boton)}</button><button class="btn" data-a="cerrar">Cancelar</button></div>`);
}
function pedirTexto(titulo, valor, boton, fn, tipo){
  modalCtx = {fn};
  abrirModal(`<h3>${esc(titulo)}</h3><form data-f="texto" class="form-col" style="margin-top:12px">
    <input name="v" type="${tipo||'text'}" value="${esc(valor)}" required ${tipo==='password'?'minlength="6"':''}>
    <div class="fila-sec"><button class="btn pri">${esc(boton)}</button><button type="button" class="btn" data-a="cerrar">Cancelar</button></div></form>`);
}

function modalPatada(edId, pid, jid, s){
  const e = EST[s-1];
  const actual = S.kc_patadas.find(p=>p.edicion_id===edId && p.jugador_id===jid && p.estacion===s)?.resultado;
  const errores = e.tipo==='palo' ? ['izq','der'] : ['izq','corta','der'];
  const lab = {izq:'← Izquierda', corta:'↓ Corta', der:'Derecha →'};
  modalCtx = {edId, pid, jid, s};
  abrirModal(`<h3>${esc(nombreJ(jid))}</h3><p class="muted">Estación ${s}: ${esc(e.nombre)}</p>
    <button class="op ok ${actual==='entro'?'sel':''}" data-a="pat" data-r="entro">${e.tipo==='palo'?'✓ Pegó en el palo':'✓ Entró'}</button>
    <div class="op-fila" style="grid-template-columns:repeat(${errores.length},1fr)">
      ${errores.map(r=>`<button class="op mal ${actual===r?'sel':''}" data-a="pat" data-r="${r}">${lab[r]}</button>`).join('')}</div>
    <div class="fila-sec">
      <button class="btn chico" data-a="pat" data-r="erro">✗ Erró sin dato</button>
      ${actual ? '<button class="btn chico peligro" data-a="pat" data-r="">Borrar</button>' : ''}
      <button class="btn chico" data-a="cerrar">Cancelar</button></div>`);
}

function abrirPareja(edId, parId){
  const p = parId ? pareja(parId) : null;
  parCtx = {edId, parId, j1:p?.jugador1_id||'', j2:p?.jugador2_id||''};
  pintarPareja();
}
function pintarPareja(){
  const {edId, parId, j1, j2} = parCtx;
  const usados = new Set(parejasDe(edId).filter(p=>p.id!==parId).flatMap(p=>[p.jugador1_id,p.jugador2_id]));
  const disp = S.kc_jugadores.filter(j=>(j.activo||j.id===j1||j.id===j2) && !usados.has(j.id)).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const sel = (k,v,otro) => `<select data-c="parSel" data-k="${k}"><option value="">Elegir jugador…</option>
    ${disp.filter(j=>j.id!==otro).map(j=>`<option value="${j.id}" ${j.id===v?'selected':''}>${esc(j.nombre)}</option>`).join('')}</select>`;
  const guardado = parCtx;
  abrirModal(`<h3>${parId?'Cambiar pareja':'Nueva pareja'}</h3>
    <div class="form-col" style="margin-top:12px">
      <label>Jugador 1${sel('j1',j1,j2)}</label>
      <label>Jugador 2${sel('j2',j2,j1)}</label>
      <label>¿No está en la lista?<div class="nuevo-j"><input id="nuevoJ" placeholder="Nombre del jugador nuevo"><button type="button" class="btn" data-a="parNuevoJ">Agregar</button></div></label>
    </div>
    <div class="fila-sec"><button class="btn pri" data-a="parGuardar" ${j1&&j2?'':'disabled'}>Guardar pareja</button><button class="btn" data-a="cerrar">Cancelar</button></div>`);
  parCtx = guardado;
}

// =====================================================================
// Acciones
// =====================================================================
const ACC = {
  modo: d => { UI.modo = d.m; UI.msg=''; render(); },
  cerrar: () => cerrarModal(),
  confOk: () => { const f = modalCtx?.fn; cerrarModal(); if (f) f(); },
  salir: () => {
    const hacer = async () => { await sb.auth.signOut().catch(()=>{}); UID=null; S=vacio(); COLA=[]; lsSet('kc_ultimo_uid',null); UI.modo='ingresar'; UI.msg=''; location.hash=''; render(); };
    if (COLA.length) confirmar(`Hay ${COLA.length} cambios que todavía no subieron. Si salís ahora quedan guardados en este dispositivo y se suben cuando vuelvas a entrar con esta cuenta.`, 'Salir igual', hacer);
    else hacer();
  },
  renombrarComp: () => pedirTexto('Nombre de la competencia', S.kc_perfil[0]?.nombre||'', 'Guardar', v=>cambiar('kc_perfil','upsert',{nombre:v})),
  nuevaEd: () => {
    const id = uuid();
    cambiar('kc_ediciones','upsert',{id, nombre:`Edición ${S.kc_ediciones.length+1}`, fecha:hoy(), finalizada:false});
    ir(`#/ed/${id}/editar`);
  },
  borrarEd: d => confirmar('Se borra la edición con todas sus parejas, patadas y desempates. No se puede deshacer.', 'Borrar edición', ()=>{
    cambiar('kc_ediciones','delete',{id:d.id}); ir('#/');
  }),
  finalizar: d => {
    const ed = edicion(d.id), R = resumen(ed);
    const fin = () => cambiar('kc_ediciones','upsert',{...ed, finalizada:true});
    if (!R.completa) confirmar('Todavía faltan patadas por cargar. ¿Finalizar igual?', 'Finalizar', fin);
    else if (R.gp.estado==='empate' || R.gi.estado==='empate') confirmar('Hay un empate en el primer puesto sin definir. Podés cargar la muerte súbita en la pestaña Desempate.', 'Finalizar igual', fin);
    else fin();
  },
  reabrir: d => cambiar('kc_ediciones','upsert',{...edicion(d.id), finalizada:false}),
  parejaModal: d => abrirPareja(d.ed, d.id),
  parNuevoJ: () => {
    const nombre = (document.getElementById('nuevoJ').value||'').trim();
    if (!nombre) return;
    let j = S.kc_jugadores.find(x=>x.nombre.toLowerCase()===nombre.toLowerCase());
    const ctx = parCtx;
    if (!j){ j = {id:uuid(), nombre, activo:true}; cambiar('kc_jugadores','upsert',j); }
    parCtx = ctx;
    if (!parCtx.j1 && parCtx.j2!==j.id) parCtx.j1 = j.id; else if (!parCtx.j2 && parCtx.j1!==j.id) parCtx.j2 = j.id;
    pintarPareja();
  },
  parGuardar: () => {
    const {edId, parId, j1, j2} = parCtx;
    if (!j1 || !j2 || j1===j2) return;
    const existente = parId ? pareja(parId) : null;
    const numero = existente ? existente.numero : 1 + Math.max(0, ...parejasDe(edId).map(p=>p.numero));
    cerrarModal();
    cambiar('kc_parejas','upsert',{id:parId||uuid(), edicion_id:edId, numero, jugador1_id:j1, jugador2_id:j2});
  },
  borrarPareja: d => {
    const n = S.kc_patadas.filter(x=>x.pareja_id===d.id).length;
    confirmar(`Se borra la pareja ${nombreParejaId(d.id)}${n?` y sus ${n} patadas cargadas`:''}.`, 'Borrar pareja', ()=>cambiar('kc_parejas','delete',{id:d.id}));
  },
  celda: d => modalPatada(ruta()[1], d.p, d.j, +d.s),
  pat: d => {
    const {edId, pid, jid, s} = modalCtx; cerrarModal();
    if (!d.r){ cambiar('kc_patadas','delete',{edicion_id:edId, jugador_id:jid, estacion:s}); return; }
    const ex = S.kc_patadas.find(p=>p.edicion_id===edId && p.jugador_id===jid && p.estacion===s);
    cambiar('kc_patadas','upsert',{id:ex?.id||uuid(), edicion_id:edId, pareja_id:pid, jugador_id:jid, estacion:s, resultado:d.r, updated_at:new Date().toISOString()});
  },
  des: d => {
    const k = {edicion_id:d.ed, tipo:d.tipo, ronda:+d.ronda, participante_id:d.part};
    if (d.v==='del'){ cambiar('kc_desempates','delete',k); return; }
    const ex = S.kc_desempates.find(x=>coincide(x,k));
    cambiar('kc_desempates','upsert',{id:ex?.id||uuid(), ...k, acierto:d.v==='1'});
  },
  renJug: d => pedirTexto('Renombrar jugador', nombreJ(d.id), 'Guardar', v=>cambiar('kc_jugadores','upsert',{...jug(d.id), nombre:v})),
  archJug: d => { const j = jug(d.id); cambiar('kc_jugadores','upsert',{...j, activo:!j.activo}); },
  borrJug: d => confirmar(`Se borra a ${nombreJ(d.id)}.`, 'Borrar jugador', ()=>cambiar('kc_jugadores','delete',{id:d.id})),
};

const CHG = {
  edNombre: el => { const v = el.value.trim(); if (v) cambiar('kc_ediciones','upsert',{...edicion(el.dataset.id), nombre:v}); },
  edFecha: el => { if (el.value) cambiar('kc_ediciones','upsert',{...edicion(el.dataset.id), fecha:el.value}); },
  statsEd: el => { UI.statsEd = el.value; render(); },
  statsJug: el => { UI.statsJug = el.value; render(); },
  parSel: el => { parCtx[el.dataset.k] = el.value; pintarPareja(); },
};

const FORMS = {
  login: async f => {
    UI.msg=''; const {error, data} = await sb.auth.signInWithPassword({email:f.email.value.trim(), password:f.pass.value});
    if (error){
      UI.msgBien=false;
      UI.msg = /confirm/i.test(error.message) ? 'Falta confirmar el email. Revisá tu casilla (y el spam).' : /invalid/i.test(error.message) ? 'Email o contraseña incorrectos.' : error.message;
      render(); return;
    }
    entrar(data.user);
  },
  registro: async f => {
    const comp = f.comp.value.trim(), email = f.email.value.trim();
    const {data, error} = await sb.auth.signUp({email, password:f.pass.value, options:{data:{competencia:comp}, emailRedirectTo: location.origin+location.pathname}});
    if (error){ UI.msgBien=false; UI.msg = /registered/i.test(error.message) ? 'Ya existe una cuenta con ese email.' : error.message; render(); return; }
    if (data.session) { entrar(data.user); return; }
    UI.modo='ingresar'; UI.msgBien=true; UI.msg=`Te mandamos un mail a ${email} para confirmar la cuenta. Confirmala y después ingresá acá.`; render();
  },
  olvido: async f => {
    const {error} = await sb.auth.resetPasswordForEmail(f.email.value.trim(), {redirectTo: location.origin+location.pathname});
    UI.msgBien=!error; UI.msg = error ? error.message : 'Listo. Te mandamos un link para elegir una contraseña nueva.'; render();
  },
  nuevoJug: f => {
    const nombre = f.nombre.value.trim(); if (!nombre) return;
    if (S.kc_jugadores.some(j=>j.nombre.toLowerCase()===nombre.toLowerCase())){ toast('Ya hay un jugador con ese nombre.'); return; }
    cambiar('kc_jugadores','upsert',{id:uuid(), nombre, activo:true});
  },
  texto: f => { const v = f.v.value.trim(); const fn = modalCtx?.fn; cerrarModal(); if (v && fn) fn(v); },
};

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const fn = ACC[b.dataset.a]; if (fn){ e.preventDefault(); fn(b.dataset, b); }
});
document.addEventListener('keydown', e=>{
  if (e.key==='Escape') cerrarModal();
  if ((e.key==='Enter'||e.key===' ') && e.target.matches('td[data-a]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', e=>{ const el = e.target.closest('[data-c]'); if (el && CHG[el.dataset.c]) CHG[el.dataset.c](el); });
document.addEventListener('submit', e=>{ const f = e.target.closest('[data-f]'); if (!f) return; e.preventDefault(); FORMS[f.dataset.f](f); });
window.addEventListener('hashchange', render);
window.addEventListener('online', ()=>{ pintarSync(); bajar(); });
window.addEventListener('offline', pintarSync);
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible') bajar(); });
setInterval(()=>{ if (COLA.length) sincronizar(); }, 20000);

// =====================================================================
// Arranque
// =====================================================================
async function entrar(user){
  UID = user.id; META = user.user_metadata || {};
  lsSet('kc_ultimo_uid', UID);
  S = lsGet('kc_cache_'+UID, vacio()); TABLAS.forEach(t=>{ if (!Array.isArray(S[t])) S[t]=[]; });
  COLA = lsGet('kc_cola_'+UID, []);
  UI.msg = '';
  if (!location.hash) location.hash = '#/';
  render();
  await bajar();
  asegurarPerfil();
}

async function iniciar(){
  if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY || /PEGAR/.test(CFG.SUPABASE_ANON_KEY)){
    $app.innerHTML = '<main><div class="panel"><h2>Falta configurar</h2><p>Completá <code>config.js</code> con la URL y la anon key de Supabase.</p></div></main>';
    return;
  }
  if (!window.supabase){
    $app.innerHTML = '<main><div class="panel"><h2>Sin conexión</h2><p>Abrí la app una vez con internet para que quede disponible sin señal.</p></div></main>';
    return;
  }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((ev, session)=>{
    if (ev==='PASSWORD_RECOVERY') setTimeout(()=>pedirTexto('Elegí tu nueva contraseña','', 'Guardar contraseña', async v=>{
      const {error} = await sb.auth.updateUser({password:v}); toast(error ? error.message : 'Contraseña actualizada.');
    }, 'password'), 0);
    if (ev==='SIGNED_IN' && session && !UID) setTimeout(()=>entrar(session.user), 0);
  });
  let session = null;
  try{ ({data:{session}} = await sb.auth.getSession()); }catch(e){}
  if (session) return entrar(session.user);
  const ultimo = lsGet('kc_ultimo_uid', null);
  if (!navigator.onLine && ultimo && lsGet('kc_cache_'+ultimo, null)) return entrar({id:ultimo, user_metadata:{}});
  render();
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
iniciar();
</script>
