<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07120d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kick Challenge">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Kick Challenge</title>
<style>
:root{
  --bg:#07120d; --s1:#0e1f17; --s2:#142a20; --s3:#1c3a2c; --line:#244438;
  --ink:#ecf5ee; --muted:#8ca698; --lima:#c9f26b; --lima-t:#0a1a0f;
  --coral:#ff6f5e; --ambar:#ffb547; --cielo:#7cc8ff;
  --disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom,0px)}
:focus-visible{outline:3px solid var(--cielo);outline-offset:2px}
a{color:var(--lima)}
h1,h2,h3{font-family:var(--disp);font-weight:700;margin:0;line-height:1.05;letter-spacing:.2px}
h2{font-size:34px}
h3{font-size:22px;margin-bottom:12px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.chico{font-size:14px}
.num{font-variant-numeric:tabular-nums}

/* Encabezado */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));position:sticky;top:0;z-index:10;background:rgba(7,18,13,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.marca{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--ink);cursor:pointer;padding:4px}
.marca b{font-family:var(--disp);font-size:24px;font-weight:800}
.top nav{display:flex;gap:4px;margin-left:8px}
.top nav a{color:var(--muted);text-decoration:none;padding:9px 14px;border-radius:999px;font-weight:600}
.top nav a.on{background:var(--s3);color:var(--ink)}
.sync{font-size:13px;padding:5px 12px;border-radius:999px;background:var(--s2);color:var(--muted)}
.sync.pend{background:rgba(255,181,71,.18);color:var(--ambar)}
.sync.off{background:rgba(255,111,94,.18);color:var(--coral)}
.salir{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;font-family:inherit}

.sponsor{margin-left:auto;display:flex;align-items:center;gap:8px;padding:0 12px 0 4px;border-right:1px solid var(--line)}
.sponsor span{font-size:11px;color:var(--muted);line-height:1.1;text-align:right;max-width:52px}
.sponsor img{height:38px;width:auto;display:block}
.p-top{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.p-top b{font-family:var(--disp);font-size:34px;font-weight:800}
.p-top .muted{font-size:20px}
.sponsor-p{margin-left:auto;display:flex;align-items:center;gap:14px}
.sponsor-p span{font-size:16px;color:var(--muted)}
.sponsor-p img{height:64px;width:auto;display:block}
.fuego{font-size:.6em;vertical-align:.12em}
.sponsor-l{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.sponsor-l span{font-size:13px;color:var(--muted)}
.sponsor-l img{height:44px;width:auto;display:block}
main{padding:18px 16px 40px;max-width:1320px;margin:0 auto}
.fila-tit{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.acc{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.volver{display:inline-block;margin-bottom:8px;text-decoration:none;color:var(--muted);font-weight:600;padding:4px 0}

/* Controles */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:var(--s2);color:var(--ink);font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;font-family:inherit}
.btn.pri{background:var(--lima);border-color:var(--lima);color:var(--lima-t);font-weight:700}
.btn.peligro{color:var(--coral);border-color:rgba(255,111,94,.4);background:transparent}
.btn.mini{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:default}
.linkbtn{background:none;border:0;color:var(--muted);font-weight:600;font-size:15px;padding:8px 4px;cursor:pointer;font-family:inherit;text-decoration:underline;text-underline-offset:3px}
input,select{min-height:48px;font-size:16px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--s1);color:var(--ink);font-family:inherit;width:100%}
input[type=date]{color-scheme:dark}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px;color:var(--muted)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:18px}
.card+.card{margin-top:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.form-col{display:flex;flex-direction:column;gap:12px}
.fila-form{display:flex;gap:10px}
.fila-form input{flex:1}
.fila-sec{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.aviso{background:rgba(255,181,71,.12);border:1px solid rgba(255,181,71,.35);color:#ffd9a0;padding:10px 14px;border-radius:12px;font-size:15px}
.chip{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip.curso{background:rgba(201,242,107,.15);color:var(--lima)}
.chip.fin{background:var(--s3);color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px}
.tabs a{padding:10px 18px;text-decoration:none;color:var(--muted);font-weight:700;border-radius:999px;background:var(--s1);border:1px solid var(--line);white-space:nowrap}
.tabs a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.alerta{display:inline-block;background:var(--coral);color:#fff;border-radius:999px;font-size:12px;padding:0 7px;margin-left:5px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%}
.t th,.t td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left}
.t th{font-size:13px;color:var(--muted);font-weight:600}
.t .n{text-align:right;font-variant-numeric:tabular-nums}
.t .c{text-align:center}

/* Inicio */
.hero{background:linear-gradient(135deg,#153a28 0%,#0e1f17 70%);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.hero h2{font-size:44px}
.hero .muted{margin-top:6px}
.lista-ed{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ed-card{display:block;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:18px;text-decoration:none;color:var(--ink)}
.ed-card:active{background:var(--s2)}
.ed-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ed-top b{font-family:var(--disp);font-size:26px;font-weight:700}
.ed-gan{margin-top:10px;display:grid;grid-template-columns:22px 1fr;gap:4px 8px;font-size:15px}

/* Ganadores banda */
.banda{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.banda>div{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.banda span{display:block;font-size:13px;color:var(--muted)}
.banda strong{font-family:var(--disp);font-size:22px;font-weight:700}

/* En vivo */
.vivo{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.progreso{display:flex;gap:6px;margin-bottom:14px;align-items:center}
.progreso i{flex:1;height:8px;border-radius:4px;background:var(--s3)}
.progreso i.hecha{background:var(--lima)}
.progreso i.ahora{background:linear-gradient(90deg,var(--lima) var(--p,0%),var(--s3) var(--p,0%))}
.progreso span{font-size:13px;color:var(--muted);margin-left:6px;white-space:nowrap}
.turno{background:radial-gradient(120% 100% at 0% 0%,#1b4230 0%,var(--s1) 55%);border:1px solid var(--line);border-radius:24px;padding:20px}
.turno-top{display:flex;gap:16px;align-items:center}
.est-num{font-family:var(--disp);font-size:76px;font-weight:800;line-height:.85;color:var(--lima)}
.est-nom{font-family:var(--disp);font-size:30px;font-weight:700;line-height:1}
.mapa-mini{margin-left:auto;width:118px;flex-shrink:0}
.patea{margin-top:18px}
.patea .muted{font-size:15px}
.patea h1{font-size:62px;font-weight:800;line-height:.95;margin-top:2px}
.prob{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:center;margin-top:16px;background:rgba(0,0,0,.22);border-radius:18px;padding:14px 16px}
.prob-num{font-family:var(--disp);font-size:68px;font-weight:800;line-height:.9;grid-row:span 2}
.prob-num small{font-size:32px;color:var(--muted)}
.barra-p{height:14px;border-radius:7px;background:var(--s3);overflow:hidden}
.barra-p i{display:block;height:100%;border-radius:7px}
.notas{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
.notas li{padding:10px 14px;border-radius:12px;background:var(--s2);font-size:15px;border-left:4px solid var(--muted)}
.notas li.racha{border-color:var(--lima)}
.notas li.palo{border-color:var(--cielo)}
.notas li.fuego{border-color:var(--ambar)}
.botones{display:grid;gap:10px;margin-top:18px}
.b-ok{min-height:96px;font-size:30px;font-family:var(--disp);font-weight:800;border-radius:18px;border:0;background:var(--lima);color:var(--lima-t);cursor:pointer;width:100%}
.b-mal{display:grid;gap:10px}
.b-mal button{min-height:80px;font-size:24px;font-family:var(--disp);font-weight:700;border-radius:18px;border:2px solid rgba(255,111,94,.5);background:rgba(255,111,94,.08);color:var(--coral);cursor:pointer}
.b-ok:active,.b-mal button:active{transform:scale(.98)}
.turno-pie{display:flex;justify-content:space-between;gap:10px;margin-top:8px;flex-wrap:wrap}
.lado h3{display:flex;justify-content:space-between;align-items:baseline}
.lado h3 small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500}
.pos-fila{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pos-fila:last-child{border-bottom:0}
.pos-fila .p{font-family:var(--disp);font-size:22px;font-weight:700;color:var(--muted)}
.pos-fila .nm{font-weight:600;line-height:1.2}
.pos-fila .pt{font-family:var(--disp);font-size:30px;font-weight:800;text-align:right}
.pos-fila .pg{grid-column:2/4;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.pos-fila .pg .barra-p{flex:1;height:6px}
.pos-fila.lider .pt{color:var(--lima)}
.ultimas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.ult{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:center;color:var(--ink);font-family:inherit;text-align:left;font-size:15px}
.ult .r{font-size:30px;font-weight:800;width:34px;text-align:center}
.ult .r.ok{color:var(--lima)} .ult .r.mal{color:var(--coral)}
.fin-card{text-align:center;padding:30px}
.fin-card h1{font-size:54px;color:var(--lima)}

/* Planilla */
.planilla{border-collapse:separate;border-spacing:0;width:100%;min-width:960px;background:var(--s1);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.planilla th{background:var(--s2);color:var(--ink);font-family:var(--disp);font-size:20px;padding:10px 4px 8px;text-align:center;font-weight:700;line-height:1}
.planilla th span{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted);margin-top:3px}
.planilla th.izq{text-align:left;padding-left:12px}
.planilla td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;height:58px;padding:0}
.planilla td:last-child{border-right:0}
.planilla .nro{font-family:var(--disp);font-weight:800;font-size:24px;color:var(--muted);width:44px}
.planilla .nom{text-align:left;padding:0 12px;font-weight:600;white-space:nowrap}
.planilla .celda{cursor:pointer;font-size:28px;font-weight:800;min-width:68px;user-select:none;position:relative}
.planilla .celda:not(.ro):active{background:var(--s3)}
.planilla .celda.vacia:not(.ro)::after{content:"+";color:var(--s3);font-size:24px;font-weight:400}
.celda.ok{color:var(--lima)} .celda.mal{color:var(--coral)}
.planilla .tot{font-family:var(--disp);font-weight:800;font-size:24px;width:60px}
.planilla .toteq{font-family:var(--disp);font-weight:800;font-size:36px;width:90px;background:var(--s2);border-bottom:3px solid var(--s3)}
.planilla .toteq small{display:block;font-family:var(--body);font-size:11px;font-weight:700;color:var(--lima)}
.planilla tr.pts td{height:30px;font-size:13px;color:var(--muted);background:#0b1a13;border-bottom:3px solid var(--s3)}
.planilla tr.pts td.max{color:var(--ink);font-weight:700}
.planilla td.racha{background:rgba(201,242,107,.2)!important}
.planilla tr.pts td.racha{color:var(--lima)}
.pto{color:var(--ambar);font-size:30px;line-height:0;position:relative;top:-6px;margin-left:1px}
.leyenda{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:12px}
.leyenda b{font-size:18px}
.leyenda .ok{color:var(--lima)} .leyenda .mal{color:var(--coral)} .leyenda .am{color:var(--ambar)}
.leyenda i{display:inline-block;width:16px;height:12px;background:rgba(201,242,107,.35);vertical-align:middle;margin-right:4px;border-radius:3px}

/* Barras horizontales */
.hbar{display:grid;grid-template-columns:minmax(110px,190px) 1fr auto;gap:10px;align-items:center;padding:7px 0}
.hbar .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);text-decoration:none}
.hbar .tr{height:22px;border-radius:8px;background:var(--s2);overflow:hidden;position:relative}
.hbar .tr i{display:block;height:100%;border-radius:8px}
.hbar .nm small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.hbar .vl{font-family:var(--disp);font-size:26px;font-weight:800;min-width:44px;text-align:right}
.hbar.gana .vl{color:var(--lima)}

/* Récords y KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px}
.kpi b{display:block;font-family:var(--disp);font-size:46px;font-weight:800;line-height:1}
.kpi span{font-size:14px;color:var(--muted)}
.kpi.lima b{color:var(--lima)}
.timeline{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.tl{min-width:230px;background:var(--s2);border-radius:16px;padding:14px 16px;border-top:4px solid var(--lima)}
.tl .f{font-size:13px;color:var(--muted)}
.tl b{font-family:var(--disp);font-size:22px;display:block;margin:2px 0 8px}
.tl div{font-size:14px;margin-top:4px}
.chart-t{font-size:14px;color:var(--muted);margin:-6px 0 10px}
.leyenda-c{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap;margin-top:6px}
.leyenda-c i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.perfil-top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.perfil-top h1{font-size:64px;font-weight:800}
.tend{font-size:17px;font-weight:600;margin-top:8px}
.par-id{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.par-id:last-child{border-bottom:0}
.par-id b{font-family:var(--disp);font-size:26px;color:var(--lima)}

/* Jugadores */
.lista-j{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.j-card{display:flex;gap:12px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.j-card .mini-c{width:70px;flex-shrink:0}
.j-card b{font-family:var(--disp);font-size:22px;display:block;line-height:1.1}
.j-card.arch{opacity:.55}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:22px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.modal h3{font-size:30px;margin-bottom:2px}
.op-ok{min-height:84px;font-size:26px;font-family:var(--disp);font-weight:800;border-radius:16px;border:0;background:var(--lima);color:var(--lima-t);cursor:pointer;width:100%;margin-top:14px}
.op-fila{display:grid;gap:10px;margin-top:10px}
.op-mal{min-height:72px;font-size:22px;font-family:var(--disp);font-weight:700;border-radius:16px;border:2px solid rgba(255,111,94,.5);background:transparent;color:var(--coral);cursor:pointer}
.sel{outline:4px solid var(--ink);outline-offset:2px}
.nuevo-j{display:flex;gap:8px}
.nuevo-j input{flex:1}
.lista-turnos{display:flex;flex-direction:column;gap:8px;margin-top:12px}

/* Desempate */
.mini-b{min-width:54px;min-height:50px;font-size:24px;font-weight:800;border-radius:12px;border:2px solid var(--line);background:var(--s2);margin:2px;cursor:pointer;font-family:inherit}
.mini-b.ok{color:var(--lima)} .mini-b.mal{color:var(--coral)}
.mini-b.lleno.ok{background:rgba(201,242,107,.15);border-color:var(--lima)}
.mini-b.lleno.mal{background:rgba(255,111,94,.12);border-color:var(--coral)}
.gana-txt{font-family:var(--disp);font-size:28px;font-weight:800;color:var(--lima)}

/* Modo pantalla */
.pantalla{padding:20px 32px 32px;min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-content:start}
.pantalla .salir-p{opacity:.45}
.pantalla .est-num{font-size:120px}
.pantalla .est-nom{font-size:46px}
.pantalla .patea h1{font-size:110px}
.pantalla .prob-num{font-size:110px}
.pantalla .pos-fila .nm{font-size:22px}
.pantalla .pos-fila .pt{font-size:44px}
.pantalla .ultimas{grid-template-columns:1fr}
.pantalla .ult{font-size:20px;cursor:default}

/* Login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(120% 90% at 20% 0%,#1b4230 0%,var(--bg) 60%)}
.login-caja{background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:30px;max-width:430px;width:100%}
.login-caja h1{margin:14px 0 6px;font-size:44px;font-weight:800}
.login-caja form{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.msg{font-size:15px;margin-top:12px;color:var(--coral)}
.msg.bien{color:var(--lima)}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:14px;font-size:17px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:92vw;text-align:center}
#toast.ver{opacity:1;transform:translateX(-50%)}
#toast.fiesta{background:var(--lima);color:var(--lima-t)}

@media (max-width:980px){

}

  .ultimas{grid-template-columns:1fr}
  .patea h1{font-size:46px}
  .hero h2{font-size:34px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const SPONSOR_RATIO = 600/382;
function sponsorHtml(clase, texto){ return `<div class="${clase}"><span>${texto}</span><img src="${SPONSOR_LOGO}" alt="${SPONSOR_NOMBRE}"></div>`; }

// ==CORE== (cálculo de puntajes y desempates)
function puntosEstacion(est, aciertos){ return (est===7 ? PTS_PALO : PTS_NORMAL)[aciertos]; }

function calcularEdicion(parejas, patadas){
  const mapa = new Map();
  for (const p of patadas) mapa.set(p.jugador_id+'|'+p.estacion, p.resultado);
  const res = (j,s) => mapa.get(j+'|'+s) || null;
  const outP = [], outJ = [];
  for (const p of parejas){
    const st = [];
    for (let s=1; s<=8; s++){
      const r1 = res(p.jugador1_id,s), r2 = res(p.jugador2_id,s);
      const hits = (r1==='entro'?1:0) + (r2==='entro'?1:0);
      st.push({s, r1, r2, hits, pts:puntosEstacion(s,hits), max:hits===2, cargada:!!(r1&&r2)});
    }
    const rachas = [], enRacha = new Set();
    for (let i=0; i<=5; i++){
      if (st[i].max && st[i+1].max && st[i+2].max){
        rachas.push(i+1); enRacha.add(i+1); enRacha.add(i+2); enRacha.add(i+3);
      }
    }
    const base = st.reduce((a,x)=>a+x.pts,0);
    const bonus = rachas.length*BONUS_RACHA;
    const jugs = [];
    for (const [jid,k] of [[p.jugador1_id,'r1'],[p.jugador2_id,'r2']]){
      let seguidas = 0, rachasInd = 0, bas = 0; const marcas = new Set();
      for (const x of st){
        if (x[k]==='entro'){
          bas += x.s===7 ? PTS_IND_PALO : 1;
          if (++seguidas===3){ rachasInd++; marcas.add(x.s); seguidas = 0; }
        } else seguidas = 0;
      }
      const j = {jugador_id:jid, pareja_id:p.id,
        aciertos: st.filter(x=>x[k]==='entro').length,
        patadas:  st.filter(x=>x[k]).length,
        rachasInd, marcas, puntos: bas + rachasInd*BONUS_RACHA_IND};
      outJ.push(j); jugs.push(j);
    }
    outP.push({pareja:p, st, rachas, enRacha, base, bonus, total:base+bonus, cargadas:st.filter(x=>x.cargada).length, jugs});
  }
  return {parejas:outP, jugadores:outJ};
}

function resolverGanador(items, desempates){
  if (!items.length) return {estado:'vacio', ganador:null, empatados:[], rondas:[]};
  const top = Math.max(...items.map(i=>i.total));
  const empatados = items.filter(i=>i.total===top).map(i=>i.id);
  if (empatados.length===1) return {estado:'unico', ganador:empatados[0], empatados, rondas:[]};
  const porRonda = new Map();
  for (const d of desempates){
    if (!porRonda.has(d.ronda)) porRonda.set(d.ronda, new Map());
    porRonda.get(d.ronda).set(d.participante_id, d.acierto);
  }
  let vivos = [...empatados]; const rondas = [];
  for (let r=1; r<200; r++){
    const m = porRonda.get(r) || new Map();
    const completa = vivos.every(id=>m.has(id));
    rondas.push({ronda:r, vivos:[...vivos], resultados:m, completa});
    if (!completa) break;
    const pasan = vivos.filter(id=>m.get(id));
    if (pasan.length>0) vivos = pasan;          // si fallan todos, siguen todos
    if (vivos.length===1) return {estado:'resuelto', ganador:vivos[0], empatados, rondas};
  }
  return {estado:'empate', ganador:null, empatados, rondas};
}

// Puntaje rápido para la simulación (o = 8 valores 0/1)
function puntuarPareja(o1,o2){
  let t=0; const mx=[];
  for (let s=0;s<8;s++){ const h=o1[s]+o2[s]; t += (s===6?PTS_PALO:PTS_NORMAL)[h]; mx.push(h===2); }
  for (let i=0;i<=5;i++) if (mx[i]&&mx[i+1]&&mx[i+2]) t += BONUS_RACHA;
  return t;
}
function puntuarInd(o){
  let t=0, seg=0;
  for (let s=0;s<8;s++){
    if (o[s]){ t += s===6?PTS_IND_PALO:1; if (++seg===3){ t += BONUS_RACHA_IND; seg=0; } } else seg=0;
  }
  return t;
}

// Modelo de probabilidad: mezcla el promedio de todos en la estación, la efectividad
// general del jugador y su historial en esa estación. Con poco historial pesa más el promedio.
const PRIOR_EST = [.75,.6,.45,.6,.45,.45,.2,.4];
const K_EST = 6, K_JUG = 10, K_JE = 4;
const logit = p => Math.log(p/(1-p));
const sigm = x => 1/(1+Math.exp(-x));
function crearModelo(pats){
  const nS = Array(9).fill(0), aS = Array(9).fill(0), porJ = new Map();
  for (const p of pats){
    if (!p.resultado) continue;
    const ok = p.resultado==='entro' ? 1 : 0;
    nS[p.estacion]++; aS[p.estacion]+=ok;
    let j = porJ.get(p.jugador_id); if (!j){ j={n:0,a:0,est:{}}; porJ.set(p.jugador_id,j); }
    j.n++; j.a+=ok;
    const e = j.est[p.estacion] || (j.est[p.estacion]={n:0,a:0}); e.n++; e.a+=ok;
  }
  const rS = s => (aS[s] + K_EST*PRIOR_EST[s-1]) / (nS[s] + K_EST);
  const efecto = new Map();
  for (const [jid,j] of porJ){
    let esp=0; for (const s in j.est) esp += j.est[s].n * rS(+s);
    const m = Math.min(.95, Math.max(.05, esp/j.n));
    const obs = (j.a + K_JUG*m) / (j.n + K_JUG);
    efecto.set(jid, logit(obs) - logit(m));
  }
  return {
    rS, stats:porJ,
    prob(jid,s){
      const prior = sigm(logit(rS(s)) + (efecto.get(jid)||0));
      const e = porJ.get(jid)?.est[s];
      const p = e ? (e.a + K_JE*prior)/(e.n + K_JE) : prior;
      return Math.min(.97, Math.max(.03, p));
    },
    confianza(jid,s){
      const j = porJ.get(jid); const n = j?.n||0, ns = j?.est[s]?.n||0;
      return (n>=24 && ns>=3) ? 'alta' : n>=8 ? 'media' : 'baja';
    }
  };
}

async function sincronizar(){
  if (sincronizando || !sb || !UID) return;
  if (!navigator.onLine){ pintarSync(); return; }
  sincronizando = true; pintarSync();
  while (COLA.length){
    const o = COLA[0]; let res;
    try{
      if (o.op==='upsert') res = await sb.from(o.t).upsert(o.row, {onConflict: CONFLICTO[o.t]||'id'});
      else { let q = sb.from(o.t).delete(); for (const [k,v] of Object.entries(o.match)) q = q.eq(k,v); res = await q; }
    }catch(e){ res = {error:e, status:0}; }
    if (res.error){
      const st = res.status||0;
      if (st===0 || st===401 || st===408 || st===429 || st>=500){
        if (st===401){ try{ await sb.auth.refreshSession(); }catch(e){} }
        break;
      }
      console.error('No se pudo guardar', o, res.error);
      toast('No se pudo guardar un cambio: '+res.error.message);
    }
    COLA.shift(); guardarLocal();
  }
  sincronizando = false; pintarSync();
}
async function bajarTabla(t){
  const out=[]; const N=1000;
  for (let desde=0; ; desde+=N){
    const {data, error} = await sb.from(t).select('*').range(desde, desde+N-1);
    if (error) throw error;
    out.push(...data);
    if (data.length<N) break;
  }
  return out;
}
async function bajar(){
  if (!navigator.onLine || !sb || !UID) return;
  await sincronizar();
  if (COLA.length) return;
  try{
    const res = await Promise.all(TABLAS.map(bajarTabla));
    const n = vacio(); TABLAS.forEach((t,i)=>n[t]=res[i]);
    const antes = JSON.stringify(S);
    S = n; bajadoOk = true; guardarLocal();
    if (JSON.stringify(S)!==antes && !document.querySelector('.modal-bg')) render();
  }catch(e){ console.warn('No se pudo actualizar', e); }
}

function pintarSync(){
  const el = document.getElementById('sync'); if (!el) return;

function colorEf(p){

// Probabilidad de ganar: simula lo que falta miles de veces
let memoSim = {k:null, v:null};
function probGanar(R, M){
  const k = R.ed.id+'|'+R.pats.map(p=>p.jugador_id+p.estacion+p.resultado).sort().join(',');
  if (memoSim.k===k) return memoSim.v;
  const P = R.c.parejas;
  const base = P.map(x=>[x.st.map(st=>st.r1), x.st.map(st=>st.r2)]);
  const prob = P.map(x=>[x.pareja.jugador1_id,x.pareja.jugador2_id].map(j=>EST.map(e=>M.prob(j,e.n))));
  const faltan = base.some(b=>b.some(a=>a.some(r=>!r)));
  const N = faltan ? 3000 : 1;
  const wP = new Array(P.length).fill(0), wJ = new Map();
  for (let n=0;n<N;n++){
    const tot=[], ind=[];
    for (let i=0;i<P.length;i++){
      const o = [0,1].map(k=>base[i][k].map((r,s)=> r ? (r==='entro'?1:0) : (Math.random()<prob[i][k][s]?1:0)));
      tot.push(puntuarPareja(o[0],o[1]));
      ind.push([P[i].pareja.jugador1_id, puntuarInd(o[0])], [P[i].pareja.jugador2_id, puntuarInd(o[1])]);
    }
    const mx = Math.max(...tot); const ws = []; tot.forEach((t,i)=>{ if (t===mx) ws.push(i); });
    ws.forEach(i=>wP[i]+=1/ws.length);
    const mi = Math.max(...ind.map(x=>x[1])); const wi = ind.filter(x=>x[1]===mi);
    wi.forEach(x=>wJ.set(x[0], (wJ.get(x[0])||0)+1/wi.length));
  }
  const v = {pareja:new Map(P.map((x,i)=>[x.pareja.id, wP[i]/N])), ind:new Map([...wJ].map(([a,b])=>[a,b/N]))};
  memoSim = {k, v}; return v;
}

// Valor esperado para "pareja ideal"
function esperadoPareja(M,a,b){
  const p1=EST.map(e=>M.prob(a,e.n)), p2=EST.map(e=>M.prob(b,e.n));
  let E=0; const pm=[];
  for (let i=0;i<8;i++){ const both=p1[i]*p2[i], one=p1[i]+p2[i]-2*both; const T=i===6?PTS_PALO:PTS_NORMAL; E+=T[2]*both+T[1]*one; pm.push(both); }
  for (let i=0;i<=5;i++) E += BONUS_RACHA*pm[i]*pm[i+1]*pm[i+2];
  return E;
}

    g += `<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" font-size="12" fill="#8ca698" font-family="Barlow,sans-serif">${e.corto}</text>`;
  });
  for (const s of series){
    const pts = s.vals.map((v,i)=>`${(Math.cos(ang(i))*R*(v??0)).toFixed(1)},${(Math.sin(ang(i))*R*(v??0)).toFixed(1)}`).join(' ');
    g += `<polygon points="${pts}" fill="${s.fill||'none'}" stroke="${s.color}" stroke-width="${s.dash?1.5:2.5}" ${s.dash?'stroke-dasharray="4 4"':''} stroke-linejoin="round"/>`;
    if (!s.dash) s.vals.forEach((v,i)=>{ g += `<circle cx="${(Math.cos(ang(i))*R*(v??0)).toFixed(1)}" cy="${(Math.sin(ang(i))*R*(v??0)).toFixed(1)}" r="3.5" fill="${s.color}"/>`; });
  }
  return g + '</svg>';
}
function svgLinea(pts, opt={}){
  // pts: [{et, v, lbl}] ; v entre 0 y max
  const W=340, H=150, pl=30, pr=30, pt=24, pb=26;
  const max = opt.max || Math.max(1,...pts.map(p=>p.v));
  const X = i => pts.length===1 ? W/2 : pl + i*(W-pl-pr)/(pts.length-1);
  const Y = v => pt + (1-v/max)*(H-pt-pb);
  const col = opt.color || '#c9f26b';
  const id = 'g'+Math.random().toString(36).slice(2,7);
  let g = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>`;
  for (const f of [0,.5,1]) g += `<line x1="${pl}" x2="${W-pr}" y1="${Y(max*f)}" y2="${Y(max*f)}" stroke="#244438" stroke-width="1"/>`;
  if (pts.length>1){
    const line = pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
    g += `<polygon points="${X(0)},${H-pb} ${line} ${X(pts.length-1)},${H-pb}" fill="url(#${id})"/>`;
    g += `<polyline points="${line}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  pts.forEach((p,i)=>{
    g += `<circle cx="${X(i)}" cy="${Y(p.v)}" r="5" fill="${col}"/>
      <text x="${X(i)}" y="${Y(p.v)-10}" text-anchor="middle" font-size="14" font-weight="800" fill="#ecf5ee" font-family="Barlow Condensed,sans-serif">${esc(p.lbl)}</text>
      <text x="${X(i)}" y="${H-7}" text-anchor="middle" font-size="11" fill="#8ca698" font-family="Barlow,sans-serif">${esc(p.et)}</text>`;
  });
  return g + '</svg>';
}
function svgErradas(c, opt={}){

function hbars(items, opt={}){

function render(){
  if (!sb) return;
  if (!UID){ $app.innerHTML = vistaLogin(); return; }
  const prevScroll = [...document.querySelectorAll('.scroll')].map(e=>e.scrollLeft);
  const r = ruta(); let html;
  if (r[0]==='ed' && r[2]==='pantalla' && edicion(r[1])){
    $app.innerHTML = vistaPantalla(resumen(edicion(r[1])));
    return;
  }
  switch (r[0]){
    case 'jugadores': html = vistaJugadores(); break;
    case 'jugador': html = jug(r[1]) ? vistaJugador(r[1]) : vistaJugadores(); break;
    case 'estadisticas': html = vistaStats(); break;
    case 'ed': {
      const ed = edicion(r[1]);
      if (!ed){ html = vistaInicio(); break; }
      html = r[2]==='editar' ? vistaEditar(ed) : vistaEdicion(ed, r[2] || (ed.finalizada?'posiciones':'vivo'));
      break;
    }
    default: html = vistaInicio();
  }
  $app.innerHTML = header(r) + `<main>${html}</main>`;
  document.querySelectorAll('.scroll').forEach((e,i)=>{ if (prevScroll[i]) e.scrollLeft = prevScroll[i]; });
  pintarSync();
}

// ---------- En vivo ----------
function notasTurno(R, M, t){
  const notas = [];
  const x = R.c.parejas.find(y=>y.pareja.id===t.pid);
  const k = x.pareja.jugador1_id===t.jid ? 'r1' : 'r2', otro = k==='r1' ? 'r2' : 'r1';
  let seg = 0;
  for (const st of x.st){ if (st.s>=t.s) break; if (st[k]==='entro'){ if (++seg===3) seg=0; } else seg=0; }
  if (t.s===7) notas.push({c:'palo', t:`Si le pega al palo suma ${PTS_IND_PALO} puntos individuales, y la pareja ${PTS_PALO[1]} (${PTS_PALO[2]} si le pegan los dos).`});
  if (seg===2) notas.push({c:'racha', t:`Lleva 2 seguidas: si la mete suma +${BONUS_RACHA_IND} de racha individual.`});
  if (t.s>=3 && x.st[t.s-2].max && x.st[t.s-3].max){
    const rp = x.st[t.s-1][otro];
    if (rp==='entro') notas.push({c:'racha', t:`Si la mete, la pareja completa racha: +${BONUS_RACHA}.`});
    else if (!rp) notas.push({c:'racha', t:`Si convierten los dos, la pareja suma racha: +${BONUS_RACHA}.`});
  }
  let raw = 0; for (let s=t.s-1; s>=1; s--){ if (x.st[s-1][k]==='entro') raw++; else break; }
  if (raw>=4) notas.push({c:'fuego', t:`🔥 Viene de ${raw} seguidas.`});
  const td = tendencia(contarErradas(S.kc_patadas.filter(p=>p.jugador_id===t.jid)));
  if (td.lado) notas.push({c:'info', t:td.txt});
  const e = M.stats.get(t.jid)?.est[t.s];
  if (e && e.n) notas.push({c:'info', t:`En esta estación lleva ${e.a} de ${e.n} en su historial.`});
  const lider = Math.max(...R.c.parejas.map(y=>y.total));
  if (x.total<lider) notas.push({c:'info', t:`La pareja está a ${lider-x.total} ${lider-x.total===1?'punto':'puntos'} del líder.`});
  else if (lider>0 && R.c.parejas.filter(y=>y.total===lider).length===1) notas.push({c:'info', t:'La pareja va primera.'});
  return notas;
}
function enLlamas(R, jid){
  const x = R.c.parejas.find(y=>y.pareja.jugador1_id===jid || y.pareja.jugador2_id===jid); if (!x) return false;
  const k = x.pareja.jugador1_id===jid ? 'r1' : 'r2';
  const hechas = x.st.filter(st=>st[k]); let raw=0;
  for (let i=hechas.length-1;i>=0;i--){ if (hechas[i][k]==='entro') raw++; else break; }
  return raw>=4;
}

function bloqueTablas(R, PG, completa, top){

function bloqueUltimas(R, editable){

function vistaDesempate(R){

function bloqueDes(R, tipo, g, nom){
  const tit = tipo==='pareja' ? 'Premio por parejas' : 'Mejor pateador individual';
  if (g.estado==='vacio') return '';
  if (g.estado==='unico') return `<div class="card"><h3>${tit}</h3><p>Sin empate. Ganó <strong>${esc(nom(g.ganador))}</strong>.</p></div>`;
  const ro = R.ed.finalizada;
  let h = `<div class="card"><h3>${tit}</h3>` + (g.estado==='resuelto'
    ? `<p class="gana-txt">🏆 Ganó ${esc(nom(g.ganador))}</p>` : '<p>Empatados en el primer puesto. Cargá la muerte súbita ronda por ronda.</p>');
  h += `<div class="scroll"><table class="t"><thead><tr><th>${tipo==='pareja'?'Pareja':'Jugador'}</th>
    ${g.rondas.map(r=>`<th class="c">Ronda ${r.ronda}</th>`).join('')}</tr></thead><tbody>`;
  for (const id of g.empatados){
    h += `<tr><td>${esc(nom(id))}</td>`;
    for (const r of g.rondas){
      if (!r.vivos.includes(id)){ h += '<td class="c muted">–</td>'; continue; }
      const v = r.resultados.get(id);
      const base = `data-tipo="${tipo}" data-ronda="${r.ronda}" data-part="${id}" data-ed="${R.ed.id}"`;
      if (v===undefined) h += ro ? '<td class="c muted">·</td>'
        : `<td class="c"><button class="mini-b ok" data-a="des" data-v="1" ${base} aria-label="Convirtió">✓</button><button class="mini-b mal" data-a="des" data-v="0" ${base} aria-label="Falló">✗</button></td>`;
      else h += `<td class="c"><button class="mini-b lleno ${v?'ok':'mal'}" data-a="des" data-v="del" ${base} ${ro?'disabled':''} title="Tocar para borrar">${v?'✓':'✗'}</button></td>`;
    }
    h += '</tr>';
  }
  return h + '</tbody></table></div></div>';
}

// ---------- Resumen para compartir ----------
// Momentos del día: palo doble, vuelta en el primer puesto y rachas completadas.
// Se recorren las patadas en el orden en que se cargaron.
const PRIO = {vueltaFinal:1, palo:2, rachaPareja:3, vuelta:4, rachaInd:5};
function lider(c){
  const m = Math.max(...c.parejas.map(y=>y.total));
  const L = c.parejas.filter(y=>y.total===m);
  return (L.length===1 && m>0) ? L[0].pareja.id : null;
}
function momentosEdicion(R, M){
  const orden = [...R.pats].sort((a,b)=> (a.updated_at||'').localeCompare(b.updated_at||'') || a.estacion-b.estacion);
  const acum = []; const cands = [];
  let prev = calcularEdicion(R.parejas, []);
  orden.forEach((p,i)=>{
    acum.push(p);
    const c = calcularEdicion(R.parejas, acum);
    const x = c.parejas.find(y=>y.pareja.id===p.pareja_id), xa = prev.parejas.find(y=>y.pareja.id===p.pareja_id);
    const j = c.jugadores.find(y=>y.jugador_id===p.jugador_id), ja = prev.jugadores.find(y=>y.jugador_id===p.jugador_id);
    const est = EST[p.estacion-1];
    if (x && xa){
      if (p.estacion===7 && p.resultado==='entro' && x.st[6].hits===2)
        cands.push({i, tipo:'palo', icono:'🎯', txt:`${nombreJ(x.pareja.jugador1_id)} y ${nombreJ(x.pareja.jugador2_id)} le pegaron los dos al palo: +${PTS_PALO[2]}`});
      if (x.rachas.length>xa.rachas.length)
        cands.push({i, tipo:'rachaPareja', icono:'🔥', txt:`${nombreJ(p.jugador_id)} completó la racha de la pareja en ${est.nombre}: +${BONUS_RACHA}`});
      if (j && ja && j.rachasInd>ja.rachasInd)
        cands.push({i, tipo:'rachaInd', icono:'⭐', txt:`${nombreJ(p.jugador_id)} metió 3 seguidas hasta ${est.nombre}: +${BONUS_RACHA_IND}`});
      const la = lider(prev), ld = lider(c);
      if (ld===p.pareja_id && la!==ld)
        cands.push({i, tipo:p.estacion>=7?'vueltaFinal':'vuelta', icono:'⚡', txt:`Con esa patada, ${nombrePareja(x.pareja)} pasó a la punta`});
    }
    prev = c;
  });
  // uno por tipo (el más tardío), ordenados por importancia, hasta 3
  const porTipo = new Map();
  for (const c of cands) if (!porTipo.has(c.tipo) || porTipo.get(c.tipo).i < c.i) porTipo.set(c.tipo, c);
  const res = [...porTipo.values()].sort((a,b)=>PRIO[a.tipo]-PRIO[b.tipo]).slice(0,3);
  if (res.length) return res;
  // si no pasó nada: la conversión desde la estación más difícil (sin mirar quién pateó)
  let d = null;
  for (const p of orden) if (p.resultado==='entro'){ const r = M.rS(p.estacion); if (!d || r<=d.r) d = {p, r}; }
  return d ? [{tipo:'dificil', icono:'🎯', txt:`${nombreJ(d.p.jugador_id)} la metió desde ${EST[d.p.estacion-1].nombre}, la estación más difícil`}] : [];
}

function datosResumen(R, M){
  const gpId = R.gp.ganador || R.gp.empatados[0], giId = R.gi.ganador || R.gi.empatados[0];
  const gpX = R.c.parejas.find(x=>x.pareja.id===gpId), giX = R.c.jugadores.find(j=>j.jugador_id===giId);
  const top3 = conPuesto(ordenarConGanador(R.c.parejas.map(x=>({id:x.pareja.id,total:x.total,x})), ganadorDefinido(R,R.gp))).slice(0,3);
  const mr = [...R.c.parejas].sort((a,b)=>b.rachas.length-a.rachas.length)[0];
  return {gpX, giX, top3, mr, momentos:momentosEdicion(R, M)};
}

async function imagenResumen(){

  const j = jug(id), M = modelo();
  const ps = S.kc_patadas.filter(p=>p.jugador_id===id);
  const ac = ps.filter(p=>p.resultado==='entro').length;
  const eds = edicionesOrdenadas().reverse();
  const Rs = eds.map(resumen).filter(R=>R.c.jugadores.some(x=>x.jugador_id===id && x.patadas));
  let puntos=0, rachas=0, tI=0, tP=0;
  const evo = [];
  for (const R of Rs){
    const x = R.c.jugadores.find(y=>y.jugador_id===id);
    puntos += x.puntos; rachas += x.rachasInd;
    if (ganadorDefinido(R,R.gi)===id) tI++;
    const gp = ganadorDefinido(R,R.gp); if (gp && gp===x.pareja_id) tP++;
    evo.push({et:R.ed.nombre.replace(/edici[oó]n\s*/i,'Ed. '), v:x.patadas?x.aciertos/x.patadas:0, lbl:`${pct(x.aciertos,x.patadas)}%`, pts:x.puntos});
  }
  const acciones = `<div class="acc"><button class="btn mini" data-a="renJug" data-id="${id}">Renombrar</button>
    <button class="btn mini" data-a="archJug" data-id="${id}">${j.activo?'Archivar':'Reactivar'}</button>
    ${Rs.length||S.kc_parejas.some(p=>p.jugador1_id===id||p.jugador2_id===id) ? '' : `<button class="btn mini peligro" data-a="borrJug" data-id="${id}">Borrar</button>`}</div>`;
  let h = `<a class="volver" href="#/jugadores">‹ Jugadores</a><div class="perfil-top"><h1>${esc(j.nombre)}</h1>${acciones}</div>`;
  if (!ps.length) return h + '<div class="card"><p>Todavía no tiene patadas cargadas. Cuando juegue una edición vas a ver acá sus estadísticas.</p></div>';
  const porE = statsPorEstacion(ps), gen = statsPorEstacion(S.kc_patadas);
  h += `<div class="kpis"><div class="kpi lima"><b>${pct(ac,ps.length)}%</b><span>Efectividad (${ac} de ${ps.length})</span></div>
    <div class="kpi"><b>${puntos}</b><span>Puntos individuales en ${Rs.length} edicion${Rs.length===1?'':'es'}</span></div>
    <div class="kpi"><b>${rachas}</b><span>Rachas de 3 seguidas</span></div>
    <div class="kpi"><b>${tP+tI}</b><span>Títulos: ${tP} por parejas, ${tI} individual${tI===1?'':'es'}</span></div></div>`;
  // mapa + radar
  const otros = S.kc_jugadores.filter(x=>x.id!==id && S.kc_patadas.some(p=>p.jugador_id===x.id)).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  if (UI.comparar && !otros.some(o=>o.id===UI.comparar)) UI.comparar='';
  const series = [{vals:gen.map(g=>g.p), color:'#8ca698', dash:true}, {vals:porE.map(g=>g.p), color:'#c9f26b', fill:'rgba(201,242,107,.18)'}];
  if (UI.comparar){ const pc = statsPorEstacion(S.kc_patadas.filter(p=>p.jugador_id===UI.comparar)); series.push({vals:pc.map(g=>g.p), color:'#7cc8ff', fill:'rgba(124,200,255,.12)'}); }
  h += `<div class="grid2" style="margin-top:16px">
    <div class="card"><h3>Mapa de la cancha</h3><p class="chart-t">Efectividad en cada estación</p>${svgCancha(porE)}</div>
    <div class="card"><div class="fila-tit" style="margin-bottom:4px"><h3 style="margin:0">Perfil por estación</h3>
      <select data-c="comparar" style="width:auto;min-width:180px"><option value="">Comparar con…</option>${otros.map(o=>`<option value="${o.id}" ${UI.comparar===o.id?'selected':''}>${esc(o.nombre)}</option>`).join('')}</select></div>
      ${svgRadar(series)}
      <div class="leyenda-c"><span><i style="background:#c9f26b"></i>${esc(j.nombre)}</span>${UI.comparar?`<span><i style="background:#7cc8ff"></i>${esc(nombreJ(UI.comparar))}</span>`:''}<span><i style="background:#8ca698"></i>Promedio de todos</span></div></div></div>`;
  // evolución + erradas
  const ce = contarErradas(ps), td = tendencia(ce);
  h += `<div class="grid2" style="margin-top:16px">
    <div class="card"><h3>Evolución</h3><p class="chart-t">Efectividad edición por edición</p>
      ${evo.length>1 ? svgLinea(evo,{max:1}) : '<p class="muted">Se arma cuando juegue más de una edición.</p>'}
      ${evo.length>1 ? `<p class="chart-t" style="margin-top:14px">Puntos individuales</p>${svgLinea(evo.map(e=>({et:e.et, v:e.pts, lbl:String(e.pts)})),{color:'#ffb547'})}` : ''}</div>
    <div class="card"><h3>Para dónde erra</h3><p class="chart-t">Visto desde el pateador, mirando a los palos</p>
      <div style="max-width:360px;margin:0 auto">${svgErradas(ce,{lado:td.lado})}</div><p class="tend">${esc(td.txt)}</p></div></div>`;
  // chances por estación hoy
  h += `<div class="card" style="margin-top:16px"><h3>Chances por estación hoy</h3><p class="chart-t">Lo que calcula la app para su próxima patada en cada estación, según su historial y el de todos</p>
    ${hbars(EST.map(e=>{ const p=M.prob(id,e.n); return {nm:`${e.n}. ${e.nombre}`, v:Math.round(p*100), vlTxt:`${Math.round(p*100)}%`, color:colorEf(p), sub:`confianza ${M.confianza(id,e.n)}`}; }),{max:100})}</div>`;
  return h;
}

// ---------- Estadísticas generales ----------
function vistaStats(){
  const eds = edicionesOrdenadas();
  if (!eds.length) return '<h2>Estadísticas</h2><div class="card" style="margin-top:14px"><p>Cuando haya ediciones cargadas vas a ver acá el historial.</p></div>';
  if (UI.statsEd!=='todas' && !edicion(UI.statsEd)) UI.statsEd = 'todas';
  const sel = UI.statsEd==='todas' ? eds : eds.filter(e=>e.id===UI.statsEd);
  const ids = new Set(sel.map(e=>e.id));
  const pats = S.kc_patadas.filter(p=>ids.has(p.edicion_id));
  const Rs = sel.map(resumen).filter(R=>R.pats.length);
  let h = `<div class="fila-tit"><h2>Estadísticas</h2>
    <select data-c="statsEd" style="width:auto;min-width:240px"><option value="todas">Todas las ediciones</option>
    ${eds.map(e=>`<option value="${e.id}" ${UI.statsEd===e.id?'selected':''}>${esc(e.nombre)} (${fmtFecha(e.fecha)})</option>`).join('')}</select></div>`;
  if (!Rs.length) return h + '<div class="card"><p>No hay patadas cargadas en esta selección.</p></div>';

  // KPIs / récords
  let bp=null, bi=null, br=null, rachasTot=0;
  for (const R of Rs){
    for (const x of R.c.parejas){ rachasTot += x.rachas.length;
      if (!bp || x.total>bp.v) bp = {v:x.total, t:nombrePareja(x.pareja), ed:R.ed.nombre};
      if (!br || x.rachas.length>br.v) br = {v:x.rachas.length, t:nombrePareja(x.pareja), ed:R.ed.nombre}; }
    for (const j of R.c.jugadores) if (!bi || j.puntos>bi.v) bi = {v:j.puntos, t:nombreJ(j.jugador_id), ed:R.ed.nombre};
  }
  const acT = pats.filter(p=>p.resultado==='entro').length;
  h += `<div class="kpis">
    <div class="kpi lima"><b>${bp.v}</b><span>Récord de pareja: ${esc(bp.t)} (${esc(bp.ed)})</span></div>
    <div class="kpi"><b>${bi.v}</b><span>Récord individual: ${esc(bi.t)} (${esc(bi.ed)})</span></div>
    <div class="kpi"><b>${br.v}</b><span>Más rachas de pareja en una edición${br.v?`: ${esc(br.t)}`:''}</span></div>
    <div class="kpi"><b>${pct(acT,pats.length)}%</b><span>Efectividad general en ${pats.length} patadas, ${rachasTot} racha${rachasTot===1?'':'s'} de pareja</span></div></div>`;

  // Campeones (línea de tiempo)
  h += `<div class="card" style="margin-top:16px"><h3>Campeones</h3><div class="timeline">${[...Rs].reverse().map(R=>{
    const gp = ganadorDefinido(R,R.gp), gi = ganadorDefinido(R,R.gi);
    return `<div class="tl"><span class="f">${fmtFecha(R.ed.fecha)}</span><b>${esc(R.ed.nombre)}</b>
      <div>🏆 ${gp?esc(nombreParejaId(gp)):`<span class="muted">${esc(textoGanador(R.gp,R.completa,nombreParejaId))}</span>`}</div>
      <div>🎯 ${gi?esc(nombreJ(gi)):`<span class="muted">${esc(textoGanador(R.gi,R.completa,nombreJ))}</span>`}</div></div>`;
  }).join('')}</div></div>`;

  // Ranking histórico
  const ag = new Map();
  for (const R of Rs){
    for (const j of R.c.jugadores){
      if (!j.patadas) continue;
      const a = ag.get(j.jugador_id) || {id:j.jugador_id, ed:0, pat:0, ac:0, pts:0, rch:0, tP:0, tI:0};
      a.ed++; a.pat += j.patadas; a.ac += j.aciertos; a.pts += j.puntos; a.rch += j.rachasInd; ag.set(j.jugador_id, a);
    }
    const gp = ganadorDefinido(R,R.gp), gi = ganadorDefinido(R,R.gi);
    if (gi && ag.get(gi)) ag.get(gi).tI++;
    if (gp){ const p = pareja(gp); [p.jugador1_id,p.jugador2_id].forEach(i=>{ if (ag.get(i)) ag.get(i).tP++; }); }
  }
  const rank = [...ag.values()].sort((a,b)=> b.pts-a.pts || b.ac/b.pat - a.ac/a.pat);
  const rankEf = [...ag.values()].filter(a=>a.pat>=8).sort((a,b)=> b.ac/b.pat - a.ac/a.pat).slice(0,10);
  h += `<div class="grid2" style="margin-top:16px">
    <div class="card"><h3>Ranking de puntos</h3><p class="chart-t">Puntos individuales acumulados</p>
      ${hbars(rank.slice(0,12).map(a=>({nm:nombreJ(a.id)+(a.tI?' 🎯'.repeat(a.tI):'')+(a.tP?' 🏆'.repeat(a.tP):''), v:a.pts, href:`#/jugador/${a.id}`, sub:`${a.ed} ed.`})))}</div>
    <div class="card"><h3>Más efectivos</h3><p class="chart-t">Mínimo 8 patadas</p>
      ${rankEf.length ? hbars(rankEf.map(a=>{ const p=a.ac/a.pat; return {nm:nombreJ(a.id), v:Math.round(p*100), vlTxt:`${Math.round(p*100)}%`, color:colorEf(p), href:`#/jugador/${a.id}`, sub:`${a.ac}/${a.pat}`}; }),{max:100}) : '<p class="muted">Todavía nadie llegó a 8 patadas.</p>'}</div></div>`;

  // Por estación
  const porE = statsPorEstacion(pats);
  const conD = porE.filter(e=>e.n);
  const peor = conD.length ? conD.reduce((m,e)=>e.p<m.p?e:m) : null, mejor = conD.length ? conD.reduce((m,e)=>e.p>m.p?e:m) : null;
  const ce = contarErradas(pats), td = tendencia(ce);
  h += `<div class="grid3" style="margin-top:16px">
    <div class="card"><h3>Mapa de la cancha</h3><p class="chart-t">Efectividad de todos por estación</p>${svgCancha(porE)}
      ${peor&&mejor&&peor.s!==mejor.s?`<p class="chico" style="margin-top:8px">La más difícil: <b>${EST[peor.s-1].nombre}</b> (${Math.round(peor.p*100)}%). La más fácil: <b>${EST[mejor.s-1].nombre}</b> (${Math.round(mejor.p*100)}%).</p>`:''}</div>
    <div class="card"><h3>Estaciones</h3><p class="chart-t">De la más fácil a la más difícil</p>
      ${hbars([...porE].filter(e=>e.n).sort((a,b)=>b.p-a.p).map(e=>({nm:`${e.s}. ${EST[e.s-1].corto}`, v:Math.round(e.p*100), vlTxt:`${Math.round(e.p*100)}%`, color:colorEf(e.p)})),{max:100})}</div>
    <div class="card"><h3>Para dónde se erra</h3><p class="chart-t">Todas las erradas con dirección</p><div style="max-width:320px;margin:0 auto">${svgErradas(ce,{lado:td.lado})}</div><p class="chico">${esc(td.txt)}</p></div></div>`;

  // Pareja ideal (siempre con todo el historial)
  const M = modelo();
  const cand = S.kc_jugadores.filter(x=>x.activo && (M.stats.get(x.id)?.n||0)>=4);
  let ideal = '<p class="muted">Hacen falta al menos 2 jugadores activos con 4 patadas o más.</p>', equil = '';
  if (cand.length>=2){
    const combos = [];
    for (let a=0;a<cand.length;a++) for (let b=a+1;b<cand.length;b++) combos.push({a:cand[a].id, b:cand[b].id, e:esperadoPareja(M,cand[a].id,cand[b].id)});
    combos.sort((x,y)=>y.e-x.e);
    ideal = combos.slice(0,5).map(c=>`<div class="par-id"><span>${esc(nombreJ(c.a))} / ${esc(nombreJ(c.b))}</span><b>${c.e.toFixed(1)}</b></div>`).join('');
    const orden = [...cand].sort((x,y)=>esperadoInd(M,y.id)-esperadoInd(M,x.id));
    const pares = []; for (let i=0;i<Math.floor(orden.length/2);i++) pares.push([orden[i].id, orden[orden.length-1-i].id]);
    equil = pares.map(([a,b])=>`<div class="par-id"><span>${esc(nombreJ(a))} / ${esc(nombreJ(b))}</span><b>${esperadoPareja(M,a,b).toFixed(1)}</b></div>`).join('')
      + (orden.length%2 ? `<p class="muted chico" style="margin-top:8px">Queda sin pareja: ${esc(nombreJ(orden[Math.floor(orden.length/2)].id))}.</p>` : '');
  }
  h += `<div class="grid2" style="margin-top:16px">
    <div class="card"><h3>Pareja ideal</h3><p class="chart-t">Las combinaciones con más puntos esperados según el historial (jugadores activos)</p>${ideal}</div>
    <div class="card"><h3>Parejas equilibradas</h3><p class="chart-t">Para la próxima edición: el mejor con el que menos suma, así quedan parejas parecidas</p>${equil||'<p class="muted">Sin datos suficientes.</p>'}</div></div>`;
  return h;
}

function abrirModal(html){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  root.querySelector('.modal-bg').addEventListener('click', e=>{ if (e.target.classList.contains('modal-bg')) cerrarModal(); });
  const f = root.querySelector('input'); if (f) f.focus();
}
function cerrarModal(){ document.getElementById('modal-root').innerHTML=''; modalCtx=null; parCtx=null; }
function confirmar(texto, boton, fn){
  modalCtx = {fn};
  abrirModal(`<h3>¿Seguro?</h3><p class="muted" style="margin-top:8px">${esc(texto)}</p><div class="fila-sec"><button class="btn" data-a="confOk" style="background:var(--coral);border-color:var(--coral);color:#fff">${esc(boton)}</button><button class="btn" data-a="cerrar">Cancelar</button></div>`);
}
function pedirTexto(titulo, valor, boton, fn, tipo){
  modalCtx = {fn};
  abrirModal(`<h3>${esc(titulo)}</h3><form data-f="texto" class="form-col" style="margin-top:14px">
    <input name="v" type="${tipo||'text'}" value="${esc(valor)}" required ${tipo==='password'?'minlength="6"':''}>
    <div class="fila-sec"><button class="btn pri">${esc(boton)}</button><button type="button" class="btn" data-a="cerrar">Cancelar</button></div></form>`);
}
function modalPatada(edId, pid, jid, s){
  const e = EST[s-1];
  const actual = S.kc_patadas.find(p=>p.edicion_id===edId && p.jugador_id===jid && p.estacion===s)?.resultado;
  const errores = e.tipo==='palo' ? ['izq','der'] : ['izq','corta','der'];
  modalCtx = {edId, pid, jid, s};
  abrirModal(`<h3>${esc(nombreJ(jid))}</h3><p class="muted">Estación ${s}: ${esc(e.nombre)}</p>
    <button class="op-ok ${actual==='entro'?'sel':''}" data-a="pat" data-r="entro">${e.tipo==='palo'?'✓ Pegó en el palo':'✓ Entró'}</button>
    <div class="op-fila" style="grid-template-columns:repeat(${errores.length},1fr)">
      ${errores.map(r=>`<button class="op-mal ${actual===r?'sel':''}" data-a="pat" data-r="${r}">${LAB_ERR[r]}</button>`).join('')}</div>
    <div class="fila-sec"><button class="btn mini" data-a="pat" data-r="erro">✗ Erró sin dato</button>
      ${actual ? '<button class="btn mini peligro" data-a="pat" data-r="">Borrar</button>' : ''}
      <button class="btn mini" data-a="cerrar">Cancelar</button></div>`);
}
function abrirPareja(edId, parId){
  const p = parId ? pareja(parId) : null;
  parCtx = {edId, parId, j1:p?.jugador1_id||'', j2:p?.jugador2_id||''};
  pintarPareja();
}
function pintarPareja(){
  const ctx = parCtx; const {edId, parId, j1, j2} = ctx;
  const usados = new Set(parejasDe(edId).filter(p=>p.id!==parId).flatMap(p=>[p.jugador1_id,p.jugador2_id]));
  const disp = S.kc_jugadores.filter(j=>(j.activo||j.id===j1||j.id===j2) && !usados.has(j.id)).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const sel = (k,v,otro) => `<select data-c="parSel" data-k="${k}"><option value="">Elegir jugador…</option>
    ${disp.filter(j=>j.id!==otro).map(j=>`<option value="${j.id}" ${j.id===v?'selected':''}>${esc(j.nombre)}</option>`).join('')}</select>`;
  abrirModal(`<h3>${parId?'Cambiar pareja':'Nueva pareja'}</h3>
    <div class="form-col" style="margin-top:14px">
      <label>Jugador 1${sel('j1',j1,j2)}</label><label>Jugador 2${sel('j2',j2,j1)}</label>
      <label>¿No está en la lista?<div class="nuevo-j"><input id="nuevoJ" placeholder="Nombre del jugador nuevo"><button type="button" class="btn" data-a="parNuevoJ">Agregar</button></div></label></div>
    <div class="fila-sec"><button class="btn pri" data-a="parGuardar" ${j1&&j2?'':'disabled'}>Guardar pareja</button><button class="btn" data-a="cerrar">Cancelar</button></div>`);
  parCtx = ctx;
}
function modalElegirTurno(R){
  const T = turnoActual(R);
  const est = T.actual ? T.actual.s : 1;
  const lista = T.pend.filter(t=>t.s===est).concat(T.pend.filter(t=>t.s!==est).slice(0,6));
  abrirModal(`<h3>¿Quién patea?</h3><p class="muted">Pendientes de la estación ${est} y las siguientes.</p>
    <div class="lista-turnos">${lista.map(t=>`<button class="btn" data-a="setTurno" data-j="${t.jid}" data-s="${t.s}" style="justify-content:space-between"><span>${esc(nombreJ(t.jid))}</span><span class="muted">Estación ${t.s}</span></button>`).join('')}</div>
    <div class="fila-sec"><button class="btn mini" data-a="cerrar">Cancelar</button></div>`);
}

// =====================================================================
// Acciones
// =====================================================================
function guardarPatada(edId, pid, jid, s, r){
  if (!r){ cambiar('kc_patadas','delete',{edicion_id:edId, jugador_id:jid, estacion:s}); return; }
  const ex = S.kc_patadas.find(p=>p.edicion_id===edId && p.jugador_id===jid && p.estacion===s);
  cambiar('kc_patadas','upsert',{id:ex?.id||uuid(), edicion_id:edId, pareja_id:pid, jugador_id:jid, estacion:s, resultado:r, updated_at:new Date().toISOString()});
}
const ACC = {
  modo: d => { UI.modo = d.m; UI.msg=''; render(); },
  cerrar: () => cerrarModal(),
  confOk: () => { const f = modalCtx?.fn; cerrarModal(); if (f) f(); },
  salir: () => {
    const hacer = async () => { await sb.auth.signOut().catch(()=>{}); UID=null; S=vacio(); COLA=[]; lsSet('kc_ultimo_uid',null); UI.modo='ingresar'; UI.msg=''; location.hash=''; render(); };
    if (COLA.length) confirmar(`Hay ${COLA.length} cambios que todavía no subieron. Si salís ahora quedan guardados en este dispositivo y se suben cuando vuelvas a entrar con esta cuenta.`, 'Salir igual', hacer);
    else hacer();
  },
  renombrarComp: () => pedirTexto('Nombre de la competencia', S.kc_perfil[0]?.nombre||'', 'Guardar', v=>cambiar('kc_perfil','upsert',{nombre:v})),
  nuevaEd: () => {
    const id = uuid();
    cambiar('kc_ediciones','upsert',{id, nombre:`Edición ${S.kc_ediciones.length+1}`, fecha:hoy(), finalizada:false});
    ir(`#/ed/${id}/editar`);
  },
  borrarEd: d => confirmar('Se borra la edición con todas sus parejas, patadas y desempates. No se puede deshacer.', 'Borrar edición', ()=>{ cambiar('kc_ediciones','delete',{id:d.id}); ir('#/'); }),
  finalizar: d => {
    const ed = edicion(d.id), R = resumen(ed);
    const fin = () => cambiar('kc_ediciones','upsert',{...ed, finalizada:true});
    if (!R.completa) confirmar('Todavía faltan patadas por cargar. ¿Finalizar igual?', 'Finalizar', fin);
    else if (R.gp.estado==='empate' || R.gi.estado==='empate') confirmar('Hay un empate en el primer puesto sin definir. Podés cargar la muerte súbita en la pestaña Desempate.', 'Finalizar igual', fin);
    else fin();
  },
  reabrir: d => cambiar('kc_ediciones','upsert',{...edicion(d.id), finalizada:false}),
  parejaModal: d => abrirPareja(d.ed, d.id),
  parNuevoJ: () => {
    const nombre = (document.getElementById('nuevoJ').value||'').trim(); if (!nombre) return;
    const ctx = parCtx;
    let j = S.kc_jugadores.find(x=>x.nombre.toLowerCase()===nombre.toLowerCase());
    if (!j){ j = {id:uuid(), nombre, activo:true}; cambiar('kc_jugadores','upsert',j); }
    parCtx = ctx;
    if (!parCtx.j1 && parCtx.j2!==j.id) parCtx.j1 = j.id; else if (!parCtx.j2 && parCtx.j1!==j.id) parCtx.j2 = j.id;
    pintarPareja();
  },
  parGuardar: () => {
    const {edId, parId, j1, j2} = parCtx;
    if (!j1 || !j2 || j1===j2) return;
    const ex = parId ? pareja(parId) : null;
    const numero = ex ? ex.numero : 1 + Math.max(0, ...parejasDe(edId).map(p=>p.numero));
    cerrarModal();
    cambiar('kc_parejas','upsert',{id:parId||uuid(), edicion_id:edId, numero, jugador1_id:j1, jugador2_id:j2});
  },
  borrarPareja: d => {
    const n = S.kc_patadas.filter(x=>x.pareja_id===d.id).length;
    confirmar(`Se borra la pareja ${nombreParejaId(d.id)}${n?` y sus ${n} patadas cargadas`:''}.`, 'Borrar pareja', ()=>cambiar('kc_parejas','delete',{id:d.id}));
  },
  celda: d => modalPatada(ruta()[1], d.p, d.j, +d.s),
  pat: d => { const {edId, pid, jid, s} = modalCtx; cerrarModal(); guardarPatada(edId, pid, jid, s, d.r); },
  vivoPat: d => {
    const edId = ruta()[1], s = +d.s;
    const antes = resumen(edicion(edId));
    UI.turno = null;
    guardarPatada(edId, d.p, d.j, s, d.r);
    const despues = resumen(edicion(edId));
    const xa = antes.c.parejas.find(x=>x.pareja.id===d.p), xd = despues.c.parejas.find(x=>x.pareja.id===d.p);
    const ja = xa.jugs.find(j=>j.jugador_id===d.j), jd = xd.jugs.find(j=>j.jugador_id===d.j);
    const partes = [];
    if (d.r==='entro') partes.push(`${nombreJ(d.j)} +${jd.puntos-ja.puntos}`);
    if (xd.total>xa.total) partes.push(`pareja +${xd.total-xa.total}`);
    let fiesta = false;
    if (xd.rachas.length>xa.rachas.length){ partes.push(`¡racha de pareja!`); fiesta = true; }
    if (jd.rachasInd>ja.rachasInd){ partes.push(`¡3 seguidas!`); fiesta = true; }
    if (partes.length) toast(partes.join(', '), fiesta);
    else toast(`${nombreJ(d.j)}: ${d.r==='erro'?'erró':'erró '+(d.r==='izq'?'a la izquierda':d.r==='der'?'a la derecha':'corta')}`);
    window.scrollTo({top:0, behavior:'smooth'});
  },
  elegirTurno: () => modalElegirTurno(resumen(edicion(ruta()[1]))),
  setTurno: d => { UI.turno = {edId:ruta()[1], jid:d.j, s:+d.s}; cerrarModal(); render(); },
  des: d => {
    const k = {edicion_id:d.ed, tipo:d.tipo, ronda:+d.ronda, participante_id:d.part};
    if (d.v==='del'){ cambiar('kc_desempates','delete',k); return; }
    const ex = S.kc_desempates.find(x=>coincide(x,k));
    cambiar('kc_desempates','upsert',{id:ex?.id||uuid(), ...k, acierto:d.v==='1'});
  },
  compartir: async () => {
    try{
      const {blob, nombre} = await imagenResumen();
      const file = new File([blob], nombre, {type:'image/png'});
      if (navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file], title:'Kick Challenge'});
      else ACC.descargar();
    }catch(e){ if (e && e.name!=='AbortError') toast('No se pudo compartir. Probá con Descargar.'); }
  },
  descargar: async () => {
    try{
      const {blob, nombre} = await imagenResumen();
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    }catch(e){ toast('No se pudo generar la imagen.'); }
  },
  renJug: d => pedirTexto('Renombrar jugador', nombreJ(d.id), 'Guardar', v=>cambiar('kc_jugadores','upsert',{...jug(d.id), nombre:v})),
  archJug: d => { const j = jug(d.id); cambiar('kc_jugadores','upsert',{...j, activo:!j.activo}); },
  borrJug: d => confirmar(`Se borra a ${nombreJ(d.id)}.`, 'Borrar jugador', ()=>{ cambiar('kc_jugadores','delete',{id:d.id}); ir('#/jugadores'); }),
};
const CHG = {
  edNombre: el => { const v = el.value.trim(); if (v) cambiar('kc_ediciones','upsert',{...edicion(el.dataset.id), nombre:v}); },
  edFecha: el => { if (el.value) cambiar('kc_ediciones','upsert',{...edicion(el.dataset.id), fecha:el.value}); },
  statsEd: el => { UI.statsEd = el.value; render(); },
  comparar: el => { UI.comparar = el.value; render(); },
  parSel: el => { parCtx[el.dataset.k] = el.value; pintarPareja(); },
};
const FORMS = {
  login: async f => {
    UI.msg=''; const {error, data} = await sb.auth.signInWithPassword({email:f.email.value.trim(), password:f.pass.value});
    if (error){
      UI.msgBien=false;
      UI.msg = /confirm/i.test(error.message) ? 'Falta confirmar el email. Revisá tu casilla (y el spam).' : /invalid/i.test(error.message) ? 'Email o contraseña incorrectos.' : error.message;
      render(); return;
    }
    entrar(data.user);
  },
  registro: async f => {
    const comp = f.comp.value.trim(), email = f.email.value.trim();
    const {data, error} = await sb.auth.signUp({email, password:f.pass.value, options:{data:{competencia:comp}, emailRedirectTo: location.origin+location.pathname}});
    if (error){ UI.msgBien=false; UI.msg = /registered/i.test(error.message) ? 'Ya existe una cuenta con ese email.' : error.message; render(); return; }
    if (data.session){ entrar(data.user); return; }
    UI.modo='ingresar'; UI.msgBien=true; UI.msg=`Te mandamos un mail a ${email} para confirmar la cuenta. Confirmala y después ingresá acá.`; render();
  },
  olvido: async f => {
    const {error} = await sb.auth.resetPasswordForEmail(f.email.value.trim(), {redirectTo: location.origin+location.pathname});
    UI.msgBien=!error; UI.msg = error ? error.message : 'Listo. Te mandamos un link para elegir una contraseña nueva.'; render();
  },
  nuevoJug: f => {
    const nombre = f.nombre.value.trim(); if (!nombre) return;
    if (S.kc_jugadores.some(j=>j.nombre.toLowerCase()===nombre.toLowerCase())){ toast('Ya hay un jugador con ese nombre.'); return; }
    cambiar('kc_jugadores','upsert',{id:uuid(), nombre, activo:true});
  },
  texto: f => { const v = f.v.value.trim(); const fn = modalCtx?.fn; cerrarModal(); if (v && fn) fn(v); },
};

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const fn = ACC[b.dataset.a]; if (fn){ e.preventDefault(); fn(b.dataset, b); }
});
document.addEventListener('keydown', e=>{
  if (e.key==='Escape') cerrarModal();
  if ((e.key==='Enter'||e.key===' ') && e.target.matches('td[data-a]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', e=>{ const el = e.target.closest('[data-c]'); if (el && CHG[el.dataset.c]) CHG[el.dataset.c](el); });
document.addEventListener('submit', e=>{ const f = e.target.closest('[data-f]'); if (!f) return; e.preventDefault(); FORMS[f.dataset.f](f); });
window.addEventListener('hashchange', ()=>{ UI.turno = null; render(); window.scrollTo(0,0); });
window.addEventListener('online', ()=>{ pintarSync(); bajar(); });
window.addEventListener('offline', pintarSync);
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible') bajar(); });
setInterval(()=>{ if (COLA.length) sincronizar(); }, 20000);
// En modo pantalla (por ejemplo en otro dispositivo) se actualiza sola cada 8 segundos
setInterval(()=>{ const r = ruta(); if (UID && r[0]==='ed' && r[2]==='pantalla' && !COLA.length) bajar(); }, 8000);

// =====================================================================
// Arranque
// =====================================================================
async function entrar(user){
  UID = user.id; META = user.user_metadata || {};
  lsSet('kc_ultimo_uid', UID);
  S = lsGet('kc_cache_'+UID, vacio()); TABLAS.forEach(t=>{ if (!Array.isArray(S[t])) S[t]=[]; });
  COLA = lsGet('kc_cola_'+UID, []);
  UI.msg = '';
  if (!location.hash) location.hash = '#/';
  render();
  await bajar();
  asegurarPerfil();
}
async function iniciar(){
  if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY || /PEGAR/.test(CFG.SUPABASE_ANON_KEY)){
    $app.innerHTML = '<main><div class="card"><h2>Falta configurar</h2><p style="margin-top:10px">Completá <code>config.js</code> con la URL y la anon key de Supabase.</p></div></main>';
    return;
  }
  if (!window.supabase){
    $app.innerHTML = '<main><div class="card"><h2>Sin conexión</h2><p style="margin-top:10px">Abrí la app una vez con internet para que quede disponible sin señal.</p></div></main>';
    return;
  }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((ev, session)=>{
    if (ev==='PASSWORD_RECOVERY') setTimeout(()=>pedirTexto('Elegí tu nueva contraseña','', 'Guardar contraseña', async v=>{
      const {error} = await sb.auth.updateUser({password:v}); toast(error ? error.message : 'Contraseña actualizada.');
    }, 'password'), 0);
    if (ev==='SIGNED_IN' && session && !UID) setTimeout(()=>entrar(session.user), 0);
  });
  let session = null;
  try{ ({data:{session}} = await sb.auth.getSession()); }catch(e){}
  if (session) return entrar(session.user);
  const ultimo = lsGet('kc_ultimo_uid', null);
  if (!navigator.onLine && ultimo && lsGet('kc_cache_'+ultimo, null)) return entrar({id:ultimo, user_metadata:{}});
  render();
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
iniciar();
</script>
